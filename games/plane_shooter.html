<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>萌樂空戰隊</title>
<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#0a1230; font-family:"Segoe UI Rounded","PingFang TC","Microsoft JhengHei",sans-serif; touch-action:none; }
  *{ box-sizing:border-box; }
  button{ font-family:inherit; cursor:pointer; }
  :root{
    --cream:#fff8ec; --pink:#ff8fab; --pink-dark:#ef5f86; --gold:#ffc857; --gold-dark:#e2a72e; --ink:#3a2b22;
  }

  /* ---------- SETUP ---------- */
  #setup{
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; overflow-y:auto;
    background: radial-gradient(circle at 50% 0%, #1c2a66, #0a1230 65%, #050817 100%);
  }
  .logo{ font-size:36px; font-weight:900; color:var(--gold); text-shadow:3px 3px 0 #1a2a5a, 0 0 16px rgba(255,200,87,0.5); letter-spacing:2px; margin-bottom:4px;}
  .subtitle{ color:#cfe0ff; font-weight:600; margin-bottom:22px;}
  .card{
    background:var(--cream); border-radius:28px; padding:26px 28px; box-shadow:0 6px 0 rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.3);
    border:4px solid #fff; max-width:420px; width:100%;
  }
  .section-label{ font-weight:800; margin:12px 0 8px; color:#7a5b2f; font-size:14px;}
  .choice-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .choice-btn{ padding:10px 16px; border-radius:14px; border:3px solid #f0dcb8; background:#fff; font-weight:800; font-size:15px; color:#8a6a3a;}
  .choice-btn.selected{ background:var(--gold); border-color:var(--gold-dark); color:#5c3e12; transform:scale(1.06);}
  .avatar-btn{ font-size:26px; padding:6px 9px; border-radius:50%; border:3px solid #f0dcb8; background:#fff;}
  .avatar-btn.selected{ background:#ffe08a; border-color:var(--gold-dark); transform:scale(1.12);}
  #startBtn{
    margin-top:18px; padding:13px 36px; border:none; border-radius:20px;
    background:linear-gradient(180deg,var(--pink),var(--pink-dark)); color:#fff; font-weight:900; font-size:18px; box-shadow:0 5px 0 #c8446a;
  }
  #startBtn:active{ transform:translateY(4px); box-shadow:none;}
  .rule-note{ font-size:12px; color:#8a8a8a; margin-top:14px; line-height:1.6;}

  /* ---------- GAME ---------- */
  #game{ display:none; position:fixed; inset:0; }
  canvas{ display:block; background:linear-gradient(180deg,#12185a,#060a24); }

  #hud-top{ position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:10; text-align:center; }
  #matchTimer{
    color:#fff; font-weight:900; font-size:22px; background:rgba(230,69,63,0.55); padding:4px 20px; border-radius:14px;
    margin-bottom:6px; display:inline-block; letter-spacing:1px;
  }
  #matchTimer.urgent{ animation: urgentPulse .5s infinite; background:rgba(230,69,63,0.9); }
  @keyframes urgentPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.1);} }
  #phaseText{ color:#fff; font-weight:800; font-size:13px; background:rgba(0,0,0,0.4); padding:4px 14px; border-radius:12px; display:inline-block;}

  #playersHud{ position:absolute; top:12px; left:12px; z-index:10; display:flex; flex-direction:column; gap:5px; }
  .hud-badge{
    display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.45); border-radius:12px; padding:4px 10px; color:#fff;
    font-size:11px; font-weight:800; border-left:4px solid #888;
  }
  .hud-badge.me{ border-left-color:var(--gold); background:rgba(255,200,87,0.2); }
  .hud-badge.dead{ opacity:0.35; text-decoration:line-through; }
  .hud-badge .av{ width:20px; height:20px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:13px;}
  .hud-badge .hp{ color:#ff8fab; }
  .hud-badge .sc{ color:var(--gold); }

  #joystickBase{
    position:absolute; bottom:34px; left:34px; width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:3px solid rgba(255,255,255,0.35); z-index:10;
  }
  #joystickKnob{
    position:absolute; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.75);
    left:32px; top:32px; box-shadow:0 3px 6px rgba(0,0,0,0.3);
  }

  #flashLayer{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:30; }
  #hitVignette{
    position:fixed; inset:0; pointer-events:none; z-index:15; opacity:0;
    box-shadow: inset 0 0 130px 50px rgba(230,69,63,0.9);
    transition: opacity .15s;
  }
  #hitVignette.show{ opacity:1; }

  #countdownText{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:25; color:var(--gold);
    font-size:90px; font-weight:900; text-shadow:0 0 30px rgba(255,200,87,0.8), 4px 4px 0 rgba(0,0,0,0.4);
    display:none;
  }

  .toast{
    position:fixed; top:78px; left:50%; transform:translateX(-50%) translateY(-30px); z-index:40;
    background:#c8283f; color:#fff; font-weight:800; padding:9px 20px; border-radius:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3); opacity:0; transition:all .25s; font-size:14px;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1;}
  .toast.diff{ background:#7a3fb0; }
  .toast.kill{ background:#e2a72e; color:#5c3e12; }

  .confetti-piece{ position:fixed; top:-40px; z-index:41; pointer-events:none; animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards;}
  @keyframes confettiFall{ 0%{ transform:translateY(0) rotate(0deg); opacity:1;} 100%{ transform:translateY(110vh) rotate(420deg); opacity:0.85;} }

  /* ---------- END OVERLAY ---------- */
  #overlay{ display:none; position:fixed; inset:0; background:rgba(5,8,25,0.78); z-index:50; align-items:center; justify-content:center;}
  .end-card{ background:var(--cream); border-radius:28px; padding:30px 34px; text-align:center; border:5px solid #fff; box-shadow:0 12px 0 rgba(0,0,0,0.2); max-width:380px;}
  .end-emoji{ font-size:56px; }
  .end-title{ font-size:24px; font-weight:900; color:var(--pink-dark); margin:8px 0;}
  .end-sub{ font-size:13.5px; color:#7a5b2f; margin-bottom:6px; line-height:1.6;}
  .end-summary{ text-align:left; margin:12px 0; font-size:13.5px; line-height:1.9;}
  .end-summary .row{ display:flex; justify-content:space-between; padding:2px 10px; border-radius:8px;}
  .end-summary .row.top{ background:#fff2c2; font-weight:900; color:#a5700a;}
  #restartBtn{ padding:12px 32px; border:none; border-radius:18px; background:linear-gradient(180deg,var(--pink),var(--pink-dark)); color:#fff; font-weight:900; font-size:15px; box-shadow:0 5px 0 #c8446a; margin-top:6px;}
  #restartBtn:active{ transform:translateY(4px); box-shadow:none;}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<div id="setup">
  <div class="logo">✈️ 萌樂空戰隊</div>
  <div class="subtitle">Q版雷電式射擊・閃彈幕、轟敵機！</div>
  <div class="card">
    <div class="section-label">🎮 選擇參賽人數(含你)</div>
    <div class="choice-row" id="playerCountRow">
      <button class="choice-btn" data-n="2">2 人</button>
      <button class="choice-btn selected" data-n="4">4 人</button>
      <button class="choice-btn" data-n="3">3 人</button>
    </div>
    <div class="section-label">🐾 選擇你的頭像</div>
    <div class="choice-row" id="avatarRow"></div>
    <div class="section-label">💰 選擇底注金幣</div>
    <div class="choice-row" id="stakeRow">
      <button class="choice-btn" data-s="50">50 金幣</button>
      <button class="choice-btn selected" data-s="100">100 金幣</button>
      <button class="choice-btn" data-s="200">200 金幣</button>
    </div>
    <button id="startBtn">起飛開戰！</button>
    <div class="rule-note">
      規則：用左下角圓圈搖桿操控飛機閃避彈幕，飛機會自動開火；<br>
      擊落敵機、擊沉戰艦可得分，被彈幕打中會扣血；<br>
      限時 <b>1 分鐘</b>，最後 10 秒彈幕會變密集、難度提升！<br>
      每人初始 3 條命，被彈幕打中扣 1 條命；<br>
      時間到後，依照「擊殺分數 × 10」計算最終獲得的金幣！
    </div>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game">
  <canvas id="gameCanvas"></canvas>

  <div id="hud-top">
    <div id="matchTimer">⏱ 60</div><br>
    <div id="phaseText">準備升空...</div>
  </div>
  <div id="playersHud"></div>
  <div id="joystickBase"><div id="joystickKnob"></div></div>

  <div id="flashLayer"></div>
  <div id="hitVignette"></div>
  <div id="countdownText"></div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ END OVERLAY ============ -->
<div id="overlay">
  <div class="end-card">
    <div class="end-emoji" id="endEmoji">🏆</div>
    <div class="end-title" id="endTitle">戰鬥結束</div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-summary" id="endSummary"></div>
    <button id="restartBtn">再玩一次</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const AVATARS = ["🐱","🐶","🐰","🐼","🦊","🐻"];
  const NAMES = ['你','阿福','小綠','阿旺'];
  const COLORS = ['#ff8fab','#6ec87a','#4fa6e0','#ffc857'];
  let chosenAvatar = 0;
  let playerCount = 4;
  let baseStake = 100;

  // ---------- 連線模式偵測 ----------
  const qs = new URLSearchParams(location.search);
  const MP = {
    enabled: !!(qs.get('room') && qs.get('token')),
    roomCode: qs.get('room') || '',
    myToken: qs.get('token') || '',
    socket: null,
    triggerToken: null,
  };

  // ---------- setup wiring ----------
  const avatarRow = document.getElementById('avatarRow');
  AVATARS.forEach((a,i)=>{
    const b = document.createElement('button');
    b.className = 'avatar-btn'+(i===0?' selected':'');
    b.textContent = a;
    b.onclick = ()=>{ [...avatarRow.children].forEach(c=>c.classList.remove('selected')); b.classList.add('selected'); chosenAvatar=i; };
    avatarRow.appendChild(b);
  });
  document.getElementById('playerCountRow').addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    [...document.getElementById('playerCountRow').children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected'); playerCount = parseInt(btn.dataset.n,10);
  });
  document.getElementById('stakeRow').addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    [...document.getElementById('stakeRow').children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected'); baseStake = parseInt(btn.dataset.s,10);
  });
  document.getElementById('startBtn').onclick = ()=>{
    document.getElementById('setup').style.display='none';
    document.getElementById('game').style.display='block';
    initGame();
  };
  document.getElementById('restartBtn').onclick = ()=> location.reload();

  // ============================================================
  // 連線模式：一進畫面就直接連線加入房間，跳過設定畫面
  // 本地只完整模擬「自己」這架飛機(操控/開火/被擊中)，其他真人玩家純粹用網路座標
  // + 自我回報的hp/score當作裝飾疊圖顯示(不參與本地敵機碰撞判定)
  // ============================================================
  if (MP.enabled) {
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    document.getElementById('phaseText').textContent = '連線中，等待遊戲開始…';

    MP.socket = io();
    MP.socket.emit('join_as_participant', { roomCode: MP.roomCode, playerToken: MP.myToken });

    MP.socket.on('plane_shooter_game_start', (payload) => {
      MP.triggerToken = payload.triggerToken;
      initMpGame(payload);
    });

    MP.socket.on('planeshooter_move', ({ token, x, y, hp, score, alive }) => {
      const p = players.find(pl => pl.token === token);
      if (p && !p.isHuman) { p.netX = x; p.netY = y; p.hp = hp; p.score = score; p.alive = alive; }
    });

    MP.socket.on('minigame_result', (payload) => {
      if (mpResultShown) return;
      mpResultShown = true;
      matchOver = true; gameRunning = false;
      showMpFinalResult(payload);
    });
  }
  let mpResultShown = false;
  let mpReportedFinal = false;

  function showMpFinalResult(payload){
    document.getElementById('overlay').style.display='flex';
    document.getElementById('endEmoji').textContent = payload.success ? '🏆' : '✈️';
    document.getElementById('endTitle').textContent = payload.success
      ? (payload.winnerName||'你')+' 拿下最高分，挑戰成功！'
      : (payload.winnerName||'其他玩家')+' 拿下最高分，觸發者這次沒能成功';
    document.getElementById('endSub').textContent = '時間到！這場戰鬥依「最高分」判定挑戰是否成功。';
    document.getElementById('endSummary').innerHTML = '';
    spawnConfetti(payload.success ? 70 : 20);
  }

  function initMpGame(payload){
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    const seatOrder = payload.seatOrder;
    players = seatOrder.map((s, i) => {
      const spread = W/(seatOrder.length+1);
      return {
        id:i, token:s.token, name: s.token===MP.myToken?'你':s.name,
        avatar: AVATARS[i%AVATARS.length], isHuman: s.token===MP.myToken, color: COLORS[i%COLORS.length],
        x: spread*(i+1), y: H-90, hp:3, maxHp:3, score:0, alive:true,
        invincible:0, fireCooldown:0, fireRate: 0.18,
      };
    });

    stars = [];
    for(let i=0;i<70;i++) stars.push({x:rand(0,W), y:rand(0,H), s:rand(1,2.6), sp:rand(40,110)});
    bullets=[]; ebullets=[]; enemies=[]; particles=[];
    spawnTimer = 0;
    renderPlayersHud();
    startMpCountdown(payload.matchStartAt);
    requestAnimationFrame(loop);
  }

  function startMpCountdown(matchStartAtAbs){
    const el = document.getElementById('countdownText');
    el.style.display='block';
    const iv = setInterval(()=>{
      const remain = matchStartAtAbs - Date.now();
      if (remain <= 0){
        clearInterval(iv); el.style.display='none';
        gameRunning = true; matchStartAt_local = matchStartAtAbs;
        document.getElementById('phaseText').textContent = '戰鬥開始！躲避彈幕、擊落敵機！';
      } else if (remain <= 700){
        el.textContent = 'GO!';
      } else {
        el.textContent = Math.ceil(remain/700);
      }
    }, 100);
  }
  let matchStartAt_local = 0;
  function getElapsed(){
    return MP.enabled ? (Date.now()-matchStartAt_local)/1000 : (performance.now()-matchStartAt)/1000;
  }

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function showToast(msg, cls){
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show'+(cls?' '+cls:'');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=> t.classList.remove('show'), 1400);
  }
  function flash(){
    const f = document.getElementById('flashLayer');
    f.style.transition='none'; f.style.opacity='0.7';
    requestAnimationFrame(()=>{ f.style.transition='opacity .4s'; f.style.opacity='0'; });
  }
  function spawnConfetti(count){
    const emojis=['🎉','🎊','✨','⭐','🏆'];
    for(let i=0;i<count;i++){
      const el=document.createElement('div');
      el.className='confetti-piece'; el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left=Math.random()*100+'vw'; el.style.fontSize=(16+Math.random()*16)+'px';
      el.style.animationDuration=(1.8+Math.random()*1.4)+'s'; el.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 3600);
    }
  }

  // ---------- joystick (always visible, mouse + touch) ----------
  let joyVec = {x:0,y:0};
  (function setupJoystick(){
    const base = document.getElementById('joystickBase');
    const knob = document.getElementById('joystickKnob');
    let active=false, baseRect=null;
    function start(e){ active=true; baseRect = base.getBoundingClientRect(); move(e); }
    function move(e){
      if(!active) return;
      const cx = baseRect.left+baseRect.width/2, cy = baseRect.top+baseRect.height/2;
      let dx = e.clientX-cx, dy = e.clientY-cy;
      const knobRadius = 23;
      const maxR = baseRect.width/2 - knobRadius;
      const dist = Math.min(Math.hypot(dx,dy), maxR);
      const ang = Math.atan2(dy,dx);
      const kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
      knob.style.left = (32+kx)+'px'; knob.style.top = (32+ky)+'px';
      joyVec.x = kx/maxR; joyVec.y = ky/maxR;
      e.preventDefault();
    }
    function end(){ active=false; joyVec.x=0; joyVec.y=0; knob.style.left='32px'; knob.style.top='32px'; }
    base.addEventListener('pointerdown', start);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  })();

  // ================= GAME STATE =================
  let canvas, ctx, W, H;
  let players = [];
  let bullets = [];   // player bullets
  let ebullets = [];  // enemy bullets
  let enemies = [];
  let particles = [];
  let stars = [];
  let matchStartAt = 0, gameRunning = false, matchOver = false;
  let shakeMag = 0;
  let spawnTimer = 0;
  const MATCH_TIME = 60;

  function initGame(){
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    const avatars = [AVATARS[chosenAvatar]];
    const pool = AVATARS.filter((_,i)=>i!==chosenAvatar);
    for(let i=1;i<playerCount;i++) avatars.push(pool[(i-1)%pool.length]);

    players = [];
    for(let i=0;i<playerCount;i++){
      const spread = W/(playerCount+1);
      players.push({
        id:i, name:i===0?'你':NAMES[i], avatar:avatars[i], isHuman:i===0, color:COLORS[i%COLORS.length],
        x: spread*(i+1), y: H-90, hp:3, maxHp:3, score:0, alive:true,
        invincible:0, fireCooldown:0, fireRate: i===0?0.18:rand(0.22,0.32)
      });
    }

    stars = [];
    for(let i=0;i<70;i++) stars.push({x:rand(0,W), y:rand(0,H), s:rand(1,2.6), sp:rand(40,110)});

    bullets=[]; ebullets=[]; enemies=[]; particles=[];
    spawnTimer = 0;
    renderPlayersHud();
    startCountdown();
    requestAnimationFrame(loop);
  }

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
  }

  function renderPlayersHud(){
    const hud = document.getElementById('playersHud');
    hud.innerHTML = '';
    players.forEach(p=>{
      const div = document.createElement('div');
      div.className = 'hud-badge'+(p.isHuman?' me':'');
      div.id = 'hb-'+p.id;
      div.innerHTML = `<div class="av">${p.avatar}</div><span>${p.name}</span><span class="hp" id="hphb-${p.id}">❤️${p.hp}</span><span class="sc" id="schb-${p.id}">🏅0</span>`;
      hud.appendChild(div);
    });
  }
  function updateHud(){
    players.forEach(p=>{
      const el = document.getElementById('hb-'+p.id);
      if(!el) return;
      el.classList.toggle('dead', !p.alive);
      const hpEl = document.getElementById('hphb-'+p.id);
      const scEl = document.getElementById('schb-'+p.id);
      if(hpEl) hpEl.textContent = '❤️'+Math.max(0,p.hp);
      if(scEl) scEl.textContent = '🏅'+p.score;
    });
  }

  function startCountdown(){
    const el = document.getElementById('countdownText');
    el.style.display='block';
    let n=3; el.textContent=n;
    const iv = setInterval(()=>{
      n--;
      if(n>0){ el.textContent=n; }
      else if(n===0){ el.textContent='GO!'; }
      else {
        clearInterval(iv); el.style.display='none';
        gameRunning = true; matchStartAt = performance.now();
        document.getElementById('phaseText').textContent = '戰鬥開始！躲避彈幕、擊落敵機！';
      }
    }, 700);
  }

  function triggerShake(mag){ shakeMag = Math.max(shakeMag, mag||6); }

  function spawnBoom(x,y,color,count){
    for(let i=0;i<(count||14);i++){
      const ang = Math.random()*Math.PI*2, sp = rand(80,260);
      particles.push({ x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:rand(0.35,0.65), color: color||'#ffc857', r:rand(2,4.5) });
    }
  }

  function spawnEnemy(tier){
    const isWarship = Math.random() < (0.2+tier*0.2);
    if(isWarship){
      enemies.push({
        type:'ship', x: rand(60,W-60), y: -40, vx: rand(-15,15), vy: rand(28,40)+tier*12,
        hp: 5+tier*4, maxHp:5+tier*4, r: 26, fireCooldown: rand(0.4,0.9), points: 30
      });
    } else {
      enemies.push({
        type:'fighter', x: rand(30,W-30), y: -20, vx: rand(-20,20), vy: rand(55,80)+tier*20,
        hp: 1, r: 15, fireCooldown: rand(0.6,1.3), points: 10
      });
    }
  }

  function playerFire(p){
    bullets.push({ x:p.x, y:p.y-18, vx:0, vy:-520, r:4, color:p.color, owner:p.id });
    if(p.isHuman){
      // small muzzle particle
      particles.push({ x:p.x, y:p.y-20, vx:rand(-20,20), vy:-60, life:0.15, color:'#fff', r:2 });
    }
  }

  function enemyFireAtTarget(e, tier){
    const target = players.filter(p=>p.alive).sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y))[0];
    const speed = 150+tier*60;
    if(e.type==='fighter'){
      let ang = Math.PI/2;
      if(target){ ang = Math.atan2(target.y-e.y, target.x-e.x); }
      ebullets.push({ x:e.x, y:e.y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed, r:5, color:'#ff6b6b' });
    } else {
      const spread = 3+tier*2;
      const baseAng = target? Math.atan2(target.y-e.y, target.x-e.x) : Math.PI/2;
      for(let i=0;i<spread;i++){
        const off = (i-(spread-1)/2) * 0.22;
        const ang = baseAng+off;
        ebullets.push({ x:e.x, y:e.y, vx:Math.cos(ang)*speed*0.85, vy:Math.sin(ang)*speed*0.85, r:5.5, color:'#c86bff' });
      }
    }
  }

  function circleHit(x1,y1,r1,x2,y2,r2){
    return Math.hypot(x1-x2,y1-y2) < (r1+r2);
  }

  function updatePlayerMovement(p, dt){
    if(!p.alive) return;
    if(MP.enabled && !p.isHuman){
      // 遠端真人玩家：不跑本地AI/物理，純粹平滑靠向網路座標，也不在本地開火
      if(typeof p.netX === 'number'){
        p.x += (p.netX-p.x) * Math.min(1, dt*8);
        p.y += (p.netY-p.y) * Math.min(1, dt*8);
      }
      if(p.invincible>0) p.invincible -= dt;
      return;
    }
    let mvx=0, mvy=0;
    if(p.isHuman){
      mvx = joyVec.x; mvy = joyVec.y;
    } else {
      // simple AI dodge: steer away from nearest close enemy bullet
      let nearest=null, nd=999;
      ebullets.forEach(b=>{
        const d = Math.hypot(b.x-p.x,b.y-p.y);
        if(d<140 && d<nd){ nd=d; nearest=b; }
      });
      if(nearest){ mvx = p.x-nearest.x; mvy = (p.y-nearest.y)*0.3; }
      else { mvx = Math.sin(performance.now()/900+p.id)*1; mvy = Math.sin(performance.now()/1400+p.id)*0.3; }
    }
    const len = Math.hypot(mvx,mvy);
    if(len>0.001){
      mvx/=len; mvy/=len;
      const speed = p.isHuman?300:250;
      p.x = Math.max(24, Math.min(W-24, p.x+mvx*speed*dt));
      p.y = Math.max(H*0.35, Math.min(H-24, p.y+mvy*speed*dt));
    }
    p.fireCooldown -= dt;
    if(p.fireCooldown<=0){ playerFire(p); p.fireCooldown = p.fireRate; }
    if(p.invincible>0) p.invincible -= dt;
  }

  function hitPlayer(p){
    if(p.invincible>0 || !p.alive) return;
    p.hp--;
    p.invincible = 1.1;
    triggerShake(8);
    spawnBoom(p.x,p.y,p.color,10);
    const vg = document.getElementById('hitVignette');
    vg.classList.add('show');
    setTimeout(()=>vg.classList.remove('show'), 180);
    if(p.hp<=0){
      p.alive = false;
      showToast((p.isHuman?'你':p.name)+' 的飛機被擊落了！', '');
      spawnBoom(p.x,p.y,'#ff5b3c',22);
      triggerShake(14);
    }
  }

  let diffTierShown = -1;
  let mpBroadcastTimer = 0;
  function loop(ts){
    requestAnimationFrame(loop);
    if(!ctx) return;
    const dt = Math.min(0.033, (loop._last? (ts-loop._last)/1000 : 0.016));
    loop._last = ts;

    ctx.save();
    if(shakeMag>0){
      ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
      shakeMag *= 0.85; if(shakeMag<0.3) shakeMag=0;
    }
    ctx.clearRect(-20,-20,W+40,H+40);

    // starfield
    ctx.fillStyle = '#fff';
    stars.forEach(s=>{
      s.y += s.sp*dt;
      if(s.y>H) s.y=0;
      ctx.globalAlpha = 0.5;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    });
    ctx.globalAlpha = 1;

    if(gameRunning && !matchOver){
      const elapsed = getElapsed();
      updateMatchTimerUI(elapsed);
      const tier = elapsed >= MATCH_TIME-10 ? 1 : 0;
      if(tier!==diffTierShown){
        diffTierShown = tier;
        if(tier>0){ showToast('⚠️ 難度提升！彈幕變密集了！', 'diff'); flash(); }
      }

      // spawn enemies
      spawnTimer -= dt;
      if(spawnTimer<=0){
        spawnEnemy(tier);
        spawnTimer = Math.max(0.28, 1.1 - tier*0.65) + rand(-0.1,0.1);
      }

      players.forEach(p=> updatePlayerMovement(p, dt));

      // player bullets
      bullets.forEach(b=>{ b.y += b.vy*dt; });
      bullets = bullets.filter(b=> b.y > -20);

      // enemy bullets
      ebullets.forEach(b=>{ b.x += b.vx*dt; b.y += b.vy*dt; });
      ebullets = ebullets.filter(b=> b.y>-20 && b.y<H+20 && b.x>-20 && b.x<W+20);

      // enemies move + fire
      enemies.forEach(e=>{
        e.x += e.vx*dt; e.y += e.vy*dt;
        if(e.x<20||e.x>W-20) e.vx*=-1;
        e.fireCooldown -= dt;
        if(e.fireCooldown<=0 && e.y>0){
          enemyFireAtTarget(e, tier);
          e.fireCooldown = e.type==='ship' ? rand(0.9,1.4)-tier*0.15 : rand(1.0,1.8)-tier*0.2;
        }
      });
      enemies = enemies.filter(e=> e.y < H+50);

      // collisions: player bullets vs enemies
      for(let bi=bullets.length-1; bi>=0; bi--){
        const b = bullets[bi];
        for(let ei=enemies.length-1; ei>=0; ei--){
          const e = enemies[ei];
          if(circleHit(b.x,b.y,b.r, e.x,e.y,e.r)){
            e.hp--;
            bullets.splice(bi,1);
            spawnBoom(b.x,b.y,'#ffe08a',5);
            if(e.hp<=0){
              const owner = players.find(p=>p.id===b.owner);
              if(owner){ owner.score += e.points; showToast((owner.isHuman?'你':owner.name)+' 擊落敵機！+'+e.points, 'kill'); }
              spawnBoom(e.x,e.y, e.type==='ship'?'#ff8f6b':'#ffd76b', e.type==='ship'?26:14);
              triggerShake(e.type==='ship'?6:2);
              enemies.splice(ei,1);
            }
            break;
          }
        }
      }

      // collisions: enemy bullets / enemies vs players (MP模式：只判定本地玩家，遠端玩家的血量由對方自己回報)
      for(let bi=ebullets.length-1; bi>=0; bi--){
        const b = ebullets[bi];
        for(const p of players){
          if(!p.alive) continue;
          if(MP.enabled && !p.isHuman) continue;
          if(circleHit(b.x,b.y,b.r, p.x,p.y,16)){
            ebullets.splice(bi,1);
            hitPlayer(p);
            break;
          }
        }
      }
      enemies.forEach(e=>{
        players.forEach(p=>{
          if(MP.enabled && !p.isHuman) return;
          if(p.alive && circleHit(e.x,e.y,e.r, p.x,p.y,16)){
            hitPlayer(p);
            e.hp = 0;
          }
        });
      });
      enemies = enemies.filter(e=> e.hp>0 || e.hp===undefined);

      // particles
      particles.forEach(pt=>{
        pt.life -= dt;
        pt.x += pt.vx*dt; pt.y += pt.vy*dt;
        pt.vx *= 0.94; pt.vy = pt.vy*0.94 + 40*dt;
      });
      particles = particles.filter(pt=> pt.life>0);

      updateHud();

      if (MP.enabled) {
        mpBroadcastTimer += dt;
        if (mpBroadcastTimer > 0.12) {
          mpBroadcastTimer = 0;
          const localP = players.find(p => p.isHuman);
          if (localP) MP.socket.emit('planeshooter_move', { x: localP.x, y: localP.y, hp: localP.hp, score: localP.score, alive: localP.alive });
        }
      }

      if(elapsed >= MATCH_TIME && !matchOver){
        matchOver = true;
        endMatch();
      }
      const allDead = MP.enabled ? players.filter(p=>p.isHuman).every(p=>!p.alive) : players.every(p=>!p.alive);
      if(allDead && !matchOver && !MP.enabled){
        matchOver = true;
        endMatch();
      }
    }

    drawScene();
    ctx.restore();
  }

  function updateMatchTimerUI(elapsed){
    const remain = Math.max(0, Math.ceil(MATCH_TIME-elapsed));
    const el = document.getElementById('matchTimer');
    el.textContent = '⏱ '+remain;
    el.classList.toggle('urgent', remain<=10);
  }

  function drawPlaneShape(x,y,color,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale||1, scale||1);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,-18); ctx.lineTo(14,14); ctx.lineTo(0,7); ctx.lineTo(-14,14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(0,-2,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawScene(){
    // enemies
    enemies.forEach(e=>{
      ctx.save();
      ctx.translate(e.x,e.y);
      if(e.type==='ship'){
        ctx.fillStyle = '#8a6bd9';
        ctx.beginPath(); ctx.ellipse(0,0,e.r,e.r*0.7,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('😠', 0, 2);
        // hp bar
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(-e.r,-e.r-10,e.r*2,4);
        ctx.fillStyle='#ff6b6b'; ctx.fillRect(-e.r,-e.r-10,e.r*2*(e.hp/e.maxHp),4);
      } else {
        ctx.fillStyle = '#e6543f';
        ctx.beginPath();
        ctx.moveTo(0,e.r); ctx.lineTo(e.r*0.8,-e.r*0.6); ctx.lineTo(0,-e.r*0.1); ctx.lineTo(-e.r*0.8,-e.r*0.6);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });

    // enemy bullets
    ebullets.forEach(b=>{
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    });
    // player bullets
    bullets.forEach(b=>{
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r*0.7,b.r*1.6,0,0,Math.PI*2); ctx.fill();
    });

    // players
    players.forEach(p=>{
      if(!p.alive) return;
      if(p.invincible>0 && Math.floor(p.invincible*12)%2===0) return; // blink
      drawPlaneShape(p.x,p.y,p.color,1);
      ctx.font='18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.avatar, p.x, p.y-26);
      // name label at the plane's tail
      ctx.font='700 11px "Segoe UI Rounded","PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const label = p.name;
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(p.x-tw/2-6, p.y+18, tw+12, 15, 7) : ctx.rect(p.x-tw/2-6, p.y+18, tw+12, 15);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(label, p.x, p.y+25.5);
    });

    // particles
    particles.forEach(pt=>{
      ctx.globalAlpha = Math.max(0, pt.life/0.6);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function computeSettlement(){
    // coins are simply score × 10, net against each player's base stake
    return players.map(p=>{
      const payout = p.score*10;
      return { player:p, payout, delta: payout-baseStake };
    }).sort((a,b)=> b.player.score-a.player.score);
  }

  function endMatch(){
    gameRunning = false;
    if (MP.enabled) {
      if (!mpReportedFinal) {
        mpReportedFinal = true;
        const localP = players.find(p => p.isHuman);
        MP.socket.emit('planeshooter_finished', { score: localP ? localP.score : 0 });
      }
      return; // 最終結果統一等 minigame_result 廣播後由 showMpFinalResult 顯示
    }
    document.getElementById('overlay').style.display='flex';
    const ranked = players.slice().sort((a,b)=>b.score-a.score);
    const top = ranked[0];
    document.getElementById('endEmoji').textContent = top.isHuman ? '🏆' : '✈️';
    document.getElementById('endTitle').textContent = top.isHuman ? '你獲得最高分！' : top.name+' 獲得最高分！';
    document.getElementById('endSub').textContent = '時間到！依照「擊殺分數 × 10」計算最終金幣：';

    const settlement = computeSettlement();
    const box = document.getElementById('endSummary');
    box.innerHTML = settlement.map((r,i)=>{
      const sign = r.delta>=0 ? '+' : '';
      const color = r.delta>=0 ? '#1f7a3d' : '#c8283f';
      return '<div class="row'+(i===0?' top':'')+'">'+
        '<span>'+r.player.avatar+' '+r.player.name+(i===0?' 🥇':'')+' (分數 '+r.player.score+')</span>'+
        '<span style="color:'+color+'; font-weight:800;">'+sign+r.delta+'</span>'+
        '</div>';
    }).join('');

    spawnConfetti(70);
  }
})();
</script>
