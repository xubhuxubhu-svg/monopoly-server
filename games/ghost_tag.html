<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>萌樂鬼抓人</title>
<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#0f1115; font-family:"Segoe UI Rounded","PingFang TC","Microsoft JhengHei",sans-serif; touch-action:none; }
  *{ box-sizing:border-box; }
  button{ font-family:inherit; cursor:pointer; }

  :root{
    --cream:#fff8ec; --pink:#ff8fab; --pink-dark:#ef5f86; --gold:#ffc857; --gold-dark:#e2a72e; --ink:#3a2b22;
  }

  /* ---------- SETUP ---------- */
  #setup{
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; overflow-y:auto;
    background: radial-gradient(circle at 50% 0%, #3a3060, #1a1530 60%, #0f0c1f 100%);
  }
  .logo{ font-size:36px; font-weight:900; color:var(--gold); text-shadow:3px 3px 0 #4a1420, 0 0 16px rgba(255,200,87,0.5); letter-spacing:2px; margin-bottom:4px;}
  .subtitle{ color:#d8cfff; font-weight:600; margin-bottom:22px;}
  .card{
    background:var(--cream); border-radius:28px; padding:26px 28px; box-shadow:0 6px 0 rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.3);
    border:4px solid #fff; max-width:420px; width:100%;
  }
  .section-label{ font-weight:800; margin:12px 0 8px; color:#7a5b2f; font-size:14px;}
  .choice-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .choice-btn{ padding:10px 16px; border-radius:14px; border:3px solid #f0dcb8; background:#fff; font-weight:800; font-size:15px; color:#8a6a3a;}
  .choice-btn.selected{ background:var(--gold); border-color:var(--gold-dark); color:#5c3e12; transform:scale(1.06);}
  .avatar-btn{ font-size:26px; padding:6px 9px; border-radius:50%; border:3px solid #f0dcb8; background:#fff;}
  .avatar-btn.selected{ background:#ffe08a; border-color:var(--gold-dark); transform:scale(1.12);}
  #startBtn{
    margin-top:18px; padding:13px 36px; border:none; border-radius:20px;
    background:linear-gradient(180deg,var(--pink),var(--pink-dark)); color:#fff; font-weight:900; font-size:18px; box-shadow:0 5px 0 #c8446a;
  }
  #startBtn:active{ transform:translateY(4px); box-shadow:none;}
  .rule-note{ font-size:12px; color:#8a8a8a; margin-top:14px; line-height:1.6;}

  /* ---------- GAME HUD ---------- */
  #game{ display:none; position:fixed; inset:0; }
  #canvasWrap{ position:absolute; inset:0; }
  canvas{ display:block; }

  #hud-top{
    position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:10; text-align:center;
  }
  #phaseText{
    color:#fff; font-weight:900; font-size:15px; background:rgba(0,0,0,0.45); padding:6px 18px; border-radius:16px;
    margin-bottom:4px; display:inline-block;
  }
  #matchTimer{
    color:#fff; font-weight:900; font-size:22px; background:rgba(230,69,63,0.55); padding:4px 20px; border-radius:14px;
    margin-bottom:6px; display:inline-block; letter-spacing:1px;
  }
  #matchTimer.urgent{ animation: urgentPulse .5s infinite; background:rgba(230,69,63,0.9); }
  @keyframes urgentPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.1);} }
  #zoneTimer{ color:var(--gold); font-weight:800; font-size:12px; }

  #playersHud{
    position:absolute; top:12px; left:12px; z-index:10; display:flex; flex-direction:column; gap:5px;
  }
  .hud-badge{
    display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.45); border-radius:12px; padding:4px 10px; color:#fff;
    font-size:11px; font-weight:800; border-left:4px solid #888;
  }
  .hud-badge.it{ border-left-color:#e6453f; background:rgba(230,69,63,0.35); }
  .hud-badge.out{ opacity:0.35; text-decoration:line-through; }
  .hud-badge .av{ width:20px; height:20px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:13px;}

  #joystickBase{
    position:absolute; bottom:34px; left:34px; width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:3px solid rgba(255,255,255,0.35); z-index:10; display:none;
  }
  #joystickKnob{
    position:absolute; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.75);
    left:32px; top:32px; box-shadow:0 3px 6px rgba(0,0,0,0.3);
  }
  #keyHint{
    position:absolute; bottom:20px; right:20px; z-index:10; color:#fff; font-size:11px; background:rgba(0,0,0,0.4);
    padding:6px 12px; border-radius:10px; text-align:right; line-height:1.6;
  }

  /* flash / vignette effect layers */
  #flashLayer{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:30; }
  #stormVignette{
    position:fixed; inset:0; pointer-events:none; z-index:15; opacity:0;
    box-shadow: inset 0 0 120px 40px rgba(230,69,63,0.85);
    transition: opacity .3s;
  }
  #stormVignette.show{ opacity:1; animation: vignettePulse 1s infinite; }
  @keyframes vignettePulse{ 0%,100%{ box-shadow: inset 0 0 120px 40px rgba(230,69,63,0.6);} 50%{ box-shadow: inset 0 0 160px 60px rgba(230,69,63,0.95);} }

  #countdownText{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:25; color:var(--gold);
    font-size:90px; font-weight:900; text-shadow:0 0 30px rgba(255,200,87,0.8), 4px 4px 0 rgba(0,0,0,0.4);
    display:none;
  }

  .toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-30px); z-index:40;
    background:#c8283f; color:#fff; font-weight:800; padding:9px 20px; border-radius:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3); opacity:0; transition:all .25s; font-size:14px;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1;}
  .toast.storm{ background:#7a3fb0; }
  .toast.win{ background:var(--gold-dark); color:#5c3e12; }

  .confetti-piece{ position:fixed; top:-40px; z-index:41; pointer-events:none; animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards;}
  @keyframes confettiFall{ 0%{ transform:translateY(0) rotate(0deg); opacity:1;} 100%{ transform:translateY(110vh) rotate(420deg); opacity:0.85;} }

  /* ---------- END OVERLAY ---------- */
  #overlay{ display:none; position:fixed; inset:0; background:rgba(10,5,25,0.75); z-index:50; align-items:center; justify-content:center;}
  .end-card{ background:var(--cream); border-radius:28px; padding:32px 36px; text-align:center; border:5px solid #fff; box-shadow:0 12px 0 rgba(0,0,0,0.2); max-width:360px;}
  .end-emoji{ font-size:56px; }
  .end-title{ font-size:25px; font-weight:900; color:var(--pink-dark); margin:8px 0;}
  .end-sub{ font-size:13.5px; color:#7a5b2f; margin-bottom:18px; line-height:1.6;}
  #restartBtn{ padding:12px 32px; border:none; border-radius:18px; background:linear-gradient(180deg,var(--pink),var(--pink-dark)); color:#fff; font-weight:900; font-size:15px; box-shadow:0 5px 0 #c8446a;}
  #restartBtn:active{ transform:translateY(4px); box-shadow:none;}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<div id="setup">
  <div class="logo">👻 鬼抓人大逃殺</div>
  <div class="subtitle">棋盤翻面・進入追逐場地！</div>
  <div class="card">
    <div class="section-label">🎮 選擇參賽人數(含你)</div>
    <div class="choice-row" id="playerCountRow">
      <button class="choice-btn" data-n="2">2 人</button>
      <button class="choice-btn selected" data-n="4">4 人</button>
      <button class="choice-btn" data-n="3">3 人</button>
    </div>
    <div class="section-label">🐾 選擇你的頭像</div>
    <div class="choice-row" id="avatarRow"></div>
    <div class="section-label">💰 選擇底注金幣</div>
    <div class="choice-row" id="stakeRow">
      <button class="choice-btn" data-s="50">50 金幣</button>
      <button class="choice-btn selected" data-s="100">100 金幣</button>
      <button class="choice-btn" data-s="200">200 金幣</button>
    </div>
    <button id="startBtn">翻面開始！</button>
    <div class="rule-note">
      規則：棋盤翻到背面變成追逐場地，隨機一人當「鬼」，<br>
      倒數 <b>30 秒</b>，鬼必須在時限內抓到所有人才算獲勝！<br>
      安全範圍邊界是實體圍牆，無法直接跑出去；<br>
      範圍中途會縮小 3 次，來不及先跑進新範圍內會被淘汰；<br>
      結算時，被抓到的人依「存活時間比例」付底注給鬼，<br>
      撐到時間結束沒被抓到的人，則能反過來從鬼身上拿到底注！
    </div>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game">
  <div id="canvasWrap"></div>

  <div id="hud-top">
    <div id="matchTimer">⏱ 30</div>
    <div id="phaseText">棋盤翻面中...</div><br>
    <div id="zoneTimer"></div>
  </div>
  <div id="playersHud"></div>
  <div id="keyHint">左下角圓圈搖桿控制方向<br>(也可用方向鍵 / WASD)</div>
  <div id="joystickBase"><div id="joystickKnob"></div></div>

  <div id="flashLayer"></div>
  <div id="stormVignette"></div>
  <div id="countdownText"></div>
</div>

<div class="toast" id="toast"></div>

<!-- ============ END OVERLAY ============ -->
<div id="overlay">
  <div class="end-card">
    <div class="end-emoji" id="endEmoji">🏆</div>
    <div class="end-title" id="endTitle">遊戲結束</div>
    <div class="end-sub" id="endSub"></div>
    <button id="restartBtn">再玩一次</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const AVATARS = ["🐱","🐶","🐰","🐼","🦊","🐻"];
  const NAMES = ['你','阿福','小綠','阿旺'];
  const COLORS = [0xff8fab, 0x6ec87a, 0x4fa6e0, 0xffc857];
  let chosenAvatar = 0;
  let playerCount = 4;
  let baseStake = 100;

  // ---------- 連線模式偵測：棋盤用 iframe 帶 room/token 進來時，跳過設定畫面直接連線 ----------
  const qs = new URLSearchParams(location.search);
  const MP = {
    enabled: !!(qs.get('room') && qs.get('token')),
    roomCode: qs.get('room') || '',
    myToken: qs.get('token') || '',
    socket: null,
    triggerToken: null,
  };

  // ---------- setup wiring ----------
  const avatarRow = document.getElementById('avatarRow');
  AVATARS.forEach((a,i)=>{
    const b = document.createElement('button');
    b.className = 'avatar-btn'+(i===0?' selected':'');
    b.textContent = a;
    b.onclick = ()=>{ [...avatarRow.children].forEach(c=>c.classList.remove('selected')); b.classList.add('selected'); chosenAvatar=i; };
    avatarRow.appendChild(b);
  });
  document.getElementById('playerCountRow').addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    [...document.getElementById('playerCountRow').children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected'); playerCount = parseInt(btn.dataset.n,10);
  });
  document.getElementById('stakeRow').addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    [...document.getElementById('stakeRow').children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected'); baseStake = parseInt(btn.dataset.s,10);
  });
  document.getElementById('startBtn').onclick = ()=>{
    document.getElementById('setup').style.display='none';
    document.getElementById('game').style.display='block';
    initGame();
  };
  document.getElementById('restartBtn').onclick = ()=>{
    location.reload();
  };

  // ============================================================
  // 連線模式：一進畫面就直接連線加入房間，跳過設定畫面，用房間座位順序建立玩家(全部真人，無AI)
  // ============================================================
  if (MP.enabled) {
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    document.getElementById('phaseText').textContent = '連線中，等待遊戲開始…';

    MP.socket = io();
    MP.socket.emit('join_as_participant', { roomCode: MP.roomCode, playerToken: MP.myToken });

    MP.socket.on('ghost_tag_game_start', (payload) => {
      MP.triggerToken = payload.triggerToken;
      initMpGame(payload);
    });

    MP.socket.on('ghosttag_move', ({ token, x, z }) => {
      const tok = tokens.find(t => t.player.token === token);
      if (tok && tok.player.alive) { tok.netX = x; tok.netZ = z; }
    });

    MP.socket.on('ghosttag_eliminate', ({ targetToken }) => {
      const tok = tokens.find(t => t.player.token === targetToken);
      if (tok) eliminatePlayer(tok, 'tag');
    });

    MP.socket.on('minigame_result', (payload) => {
      if (mpResultShown) return;
      mpResultShown = true;
      showMpFinalResult(payload);
    });
  }
  let mpResultShown = false;

  function showMpFinalResult(payload){
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('endEmoji').textContent = payload.success ? '🏆' : '👻';
    document.getElementById('endTitle').textContent = payload.success
      ? (payload.winnerName||'你')+' 挑戰成功！'
      : (payload.winnerName||'觸發者')+' 這次沒能成功';
    document.getElementById('endSub').textContent = payload.success
      ? '順利在鬼抓人挑戰中存活/獲勝！'
      : '很可惜，這次沒能撐過鬼抓人挑戰。';
  }

  function initMpGame(payload){
    const seatOrder = payload.seatOrder;
    players = seatOrder.map((s, i) => ({
      id: i, token: s.token,
      name: s.token === MP.myToken ? '你' : s.name,
      avatar: AVATARS[i % AVATARS.length],
      isHuman: s.token === MP.myToken,
      alive: true, color: COLORS[i % COLORS.length],
    }));
    itIndex = payload.itIndex;

    setupThree();
    buildBoard();
    renderPlayersHud();
    document.getElementById('phaseText').textContent = '棋盤翻面中...';
    animateFlip(()=>{
      buildArenaFromServer(payload.obstacles);
      spawnTokens();
      startMpCountdown(payload.matchStartAt);
    });
    clock = new THREE.Clock();
    animate();
  }

  function buildArenaFromServer(serverObstacles){
    obstacles = [];
    serverObstacles.forEach((ob, i)=>{
      const geo = new THREE.BoxGeometry(ob.size, ob.size, ob.size);
      const mat = new THREE.MeshStandardMaterial({color: [0xffb3c6,0xb3e0ff,0xc6f0c2,0xffe08a][i%4]});
      const box = new THREE.Mesh(geo, mat);
      box.position.set(ob.x, 0.5 + ob.size/2, ob.z);
      scene.add(box);
      const label = makeEmojiSprite('📦', 1.4);
      label.position.set(ob.x, 0.5+ob.size+0.9, ob.z);
      scene.add(label);
      obstacles.push({x:ob.x, z:ob.z, r:ob.size*0.6, mesh:box});
    });
    const ringGeo = new THREE.RingGeometry(zoneRadius-0.15, zoneRadius, 64);
    const ringMat = new THREE.MeshBasicMaterial({color:0x66e0ff, side:THREE.DoubleSide, transparent:true, opacity:0.85});
    zoneRing = new THREE.Mesh(ringGeo, ringMat);
    zoneRing.rotation.x = -Math.PI/2;
    zoneRing.position.y = 0.55;
    scene.add(zoneRing);
  }

  // 用伺服器給的絕對起跑時間(matchStartAt)倒數，讓所有client同步起跑
  function startMpCountdown(matchStartAt){
    const el = document.getElementById('countdownText');
    el.style.display='block';
    const iv = setInterval(()=>{
      const remain = matchStartAt - Date.now();
      if (remain <= 0){
        clearInterval(iv);
        el.style.display='none';
        gameRunning = true;
        matchStartAt_local = matchStartAt;
        document.getElementById('phaseText').textContent = '追逐開始！躲避 '+players[itIndex].name+'！';
      } else if (remain <= 700){
        el.textContent = 'GO!';
      } else {
        el.textContent = Math.ceil(remain/700);
      }
    }, 100);
  }
  let matchStartAt_local = 0;

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function showToast(msg, cls){
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show'+(cls?' '+cls:'');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(()=> t.classList.remove('show'), 1600);
  }
  function flash(){
    const f = document.getElementById('flashLayer');
    f.style.transition='none'; f.style.opacity='0.9';
    requestAnimationFrame(()=>{ f.style.transition='opacity .5s'; f.style.opacity='0'; });
  }
  function spawnConfetti(count){
    const emojis=['🎉','🎊','✨','⭐','🏆'];
    for(let i=0;i<count;i++){
      const el=document.createElement('div');
      el.className='confetti-piece'; el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left=Math.random()*100+'vw'; el.style.fontSize=(16+Math.random()*16)+'px';
      el.style.animationDuration=(1.8+Math.random()*1.4)+'s'; el.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 3600);
    }
  }

  // ================= THREE.JS SETUP =================
  let scene, camera, renderer, clock;
  let boardMesh, zoneRing;
  let obstacles = [];
  let tokens = []; // {player, mesh, sprite, pos:{x,z}, vel, outsideTimer, alive}
  let players = [];
  let itIndex = 0;
  let boardHalf = 20;
  let zoneRadius = 19;
  const MIN_ZONE = 4;
  const SHRINK_AMOUNT = 5;
  const MATCH_TIME = 30; // seconds — 鬼 must catch everyone within this limit
  const SHRINK_AT = [8, 16, 24]; // seconds elapsed when each shrink triggers
  const WARN_LEAD = 2; // seconds of warning before each shrink
  let shrinkStageIndex = 0;
  let warned = false;
  let matchStartAt = 0;
  let gameRunning = false;
  let matchOver = false;

  const keys = {};
  window.addEventListener('keydown', e=> keys[e.key.toLowerCase()]=true);
  window.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=false);

  // directional joystick — always visible, works with mouse AND touch (pointer events)
  let joyVec = {x:0,y:0};
  (function setupJoystick(){
    const base = document.getElementById('joystickBase');
    const knob = document.getElementById('joystickKnob');
    base.style.display = 'block';
    let active=false, baseRect=null;
    function start(e){
      active=true; baseRect = base.getBoundingClientRect();
      move(e);
    }
    function move(e){
      if(!active) return;
      const cx = baseRect.left+baseRect.width/2, cy = baseRect.top+baseRect.height/2;
      let dx = e.clientX-cx, dy = e.clientY-cy;
      const knobRadius = 23; // half of #joystickKnob's 46px width
      const maxR = baseRect.width/2 - knobRadius;
      const dist = Math.min(Math.hypot(dx,dy), maxR);
      const ang = Math.atan2(dy,dx);
      const kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
      knob.style.left = (32+kx)+'px'; knob.style.top = (32+ky)+'px';
      joyVec.x = kx/maxR; joyVec.y = ky/maxR;
      e.preventDefault();
    }
    function end(){ active=false; joyVec.x=0; joyVec.y=0; knob.style.left='32px'; knob.style.top='32px'; }
    base.addEventListener('pointerdown', start);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  })();

  function makeCanvasTexture(drawFn, size){
    size = size || 512;
    const c = document.createElement('canvas'); c.width=size; c.height=size;
    const ctx = c.getContext('2d');
    drawFn(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  function makeEmojiSprite(emoji, scale){
    const c = document.createElement('canvas'); c.width=128; c.height=128;
    const ctx = c.getContext('2d');
    ctx.font = '92px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(emoji, 64, 70);
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
    const spr = new THREE.Sprite(mat);
    spr.scale.set(scale,scale,scale);
    return spr;
  }

  function initGame(){
    const avatars = [AVATARS[chosenAvatar]];
    const pool = AVATARS.filter((_,i)=>i!==chosenAvatar);
    for(let i=1;i<playerCount;i++) avatars.push(pool[(i-1)%pool.length]);

    players = [];
    for(let i=0;i<playerCount;i++){
      players.push({ id:i, name:i===0?'你':NAMES[i], avatar:avatars[i], isHuman:i===0, alive:true, color:COLORS[i%COLORS.length] });
    }
    itIndex = Math.floor(Math.random()*players.length);

    setupThree();
    buildBoard();
    renderPlayersHud();
    document.getElementById('phaseText').textContent = '棋盤翻面中...';
    animateFlip(()=>{
      buildArena();
      spawnTokens();
      startCountdown();
    });
    clock = new THREE.Clock();
    animate();
  }

  function setupThree(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1115);
    scene.fog = new THREE.Fog(0x0f1115, 30, 70);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
    camera.position.set(0, 26, 30);
    camera.lookAt(0,0,0);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    document.getElementById('canvasWrap').appendChild(renderer.domElement);

  function buildBoard(){
    const topTex = makeCanvasTexture((ctx,s)=>{
      ctx.fillStyle = '#f4ead0'; ctx.fillRect(0,0,s,s);
      const n = 8, cell = s/n;
      for(let i=0;i<n;i++) for(let j=0;j<n;j++){
        ctx.fillStyle = (i+j)%2===0 ? '#ffe3b0' : '#ffd08a';
        ctx.fillRect(i*cell,j*cell,cell,cell);
      }
      ctx.strokeStyle='#c8923f'; ctx.lineWidth=6; ctx.strokeRect(3,3,s-6,s-6);
    });
    const botTex = makeCanvasTexture((ctx,s)=>{
      ctx.fillStyle = '#241a33'; ctx.fillRect(0,0,s,s);
      const n=10, cell=s/n;
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=2;
      for(let i=0;i<=n;i++){
        ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(s,i*cell); ctx.stroke();
      }
      ctx.strokeStyle='#e6453f'; ctx.lineWidth=8; ctx.strokeRect(4,4,s-8,s-8);
    });
    const sideMat = new THREE.MeshStandardMaterial({color:0x8a6a3a});
    const mats = [sideMat, sideMat,
      new THREE.MeshStandardMaterial({map:topTex}),
      new THREE.MeshStandardMaterial({map:botTex}),
      sideMat, sideMat];
    const geo = new THREE.BoxGeometry(boardHalf*2, 1, boardHalf*2);
    boardMesh = new THREE.Mesh(geo, mats);
    boardMesh.position.y = 0;
    scene.add(boardMesh);
  }

  function animateFlip(onDone){
    const dur = 1500;
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now-start)/dur);
      const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      boardMesh.rotation.z = Math.PI * ease;
      camera.position.y = 26 + Math.sin(t*Math.PI)*10;
      camera.position.z = 30 - Math.sin(t*Math.PI)*6;
      camera.lookAt(0,0,0);
      if(t>0.46 && t<0.54) flash();
      if(t<1){ requestAnimationFrame(step); }
      else {
        boardMesh.rotation.z = Math.PI;
        document.getElementById('phaseText').textContent = '追逐場地展開！';
        onDone();
      }
    }
    requestAnimationFrame(step);
  }

  function buildArena(){
    obstacles = [];
    const n = 9;
    for(let i=0;i<n;i++){
      let x,z, tries=0;
      do{
        x = rand(-boardHalf+4, boardHalf-4);
        z = rand(-boardHalf+4, boardHalf-4);
        tries++;
      } while(Math.hypot(x,z) < 9 && tries<20);
      const size = rand(1.6,2.6);
      const geo = new THREE.BoxGeometry(size,size,size);
      const mat = new THREE.MeshStandardMaterial({color: [0xffb3c6,0xb3e0ff,0xc6f0c2,0xffe08a][i%4]});
      const box = new THREE.Mesh(geo, mat);
      box.position.set(x, 0.5 + size/2, z);
      scene.add(box);
      const label = makeEmojiSprite('📦', 1.4);
      label.position.set(x, 0.5+size+0.9, z);
      scene.add(label);
      obstacles.push({x,z,r:size*0.6, mesh:box});
    }

    // zone ring
    const ringGeo = new THREE.RingGeometry(zoneRadius-0.15, zoneRadius, 64);
    const ringMat = new THREE.MeshBasicMaterial({color:0x66e0ff, side:THREE.DoubleSide, transparent:true, opacity:0.85});
    zoneRing = new THREE.Mesh(ringGeo, ringMat);
    zoneRing.rotation.x = -Math.PI/2;
    zoneRing.position.y = 0.55;
    scene.add(zoneRing);
  }

  function spawnBoom3D(x,z,color){

  let activeParticles = [];

  let shakeMagnitude = 0;
  function triggerShake(mag){ shakeMagnitude = Math.max(shakeMagnitude, mag||0.6); }
  let mpBroadcastTimer = 0;

  function getElapsed(){

  function eliminatePlayer(tok, reason){
    if(!tok.player.alive) return;
    tok.player.alive = false;
    tok.player.catchTime = getElapsed();
    markOut(tok.player);
    if(reason==='tag'){
      showToast((tok.player.isHuman?'你':tok.player.name)+' 被抓到了！淘汰！', '');
      activeParticles = activeParticles.concat(spawnBoom3D(tok.x, tok.z, 0xff5b5b));
      triggerShake(0.6);

      showToast((tok.player.isHuman?'你':tok.player.name)+' 被縮小的場地淘汰了！', 'storm');
      activeParticles = activeParticles.concat(spawnBoom3D(tok.x, tok.z, 0x9d6bff));
    }

  function checkEndConditions(){
    if(matchOver) return;
    const itPlayer = players[itIndex];
    const runnersAlive = players.filter((p,i)=> i!==itIndex && p.alive);
    if(runnersAlive.length===0){
      matchOver = true;
      endGame(itPlayer, 'it');
    }
  }

  function computeSettlement(){
    // zero-sum coin exchange: caught players pay 鬼 based on how early they were
    // caught (ratio of the 60s limit); anyone who survived the full limit instead
    // collects the full base stake from 鬼.
    const results = [];
    players.forEach((p,i)=>{
      if(i===itIndex) return;
      if(p.alive){
        results.push({ player:p, delta: baseStake, note:'撐到時間結束，反收 '+baseStake+' 金幣' });
      } else {
        const t = p.catchTime!==undefined ? p.catchTime : MATCH_TIME;
        const ratio = 1 - Math.min(1, t/MATCH_TIME);
        const amt = Math.max(1, Math.round(baseStake*ratio));
        results.push({ player:p, delta:-amt, note:'第 '+t.toFixed(0)+' 秒被淘汰，付出 '+amt+' 金幣' });
      }
    });
    const itDelta = -results.reduce((s,r)=>s+r.delta,0);
    results.push({ player:players[itIndex], delta:itDelta, note: itDelta>=0 ? '鬼方共收取 '+itDelta+' 金幣' : '鬼方共賠付 '+(-itDelta)+' 金幣' });
    return results;
  }

  function endGame(winner, mode){
    gameRunning = false;
    if (MP.enabled) {
      // 觸發式強制參加：只有觸發那次挑戰的玩家自己的client，決定自己這次算成功還失敗並回報
      const localTok = tokens.find(t => t.player.isHuman);
      if (localTok && localTok.player.token === MP.triggerToken) {
        const iAmIt = (localTok.player.id === itIndex);
        const success = iAmIt ? (mode === 'it') : localTok.player.alive;
        MP.socket.emit('report_trigger_outcome', { success: !!success });
      }
      return; // 最終畫面統一由 minigame_result 廣播觸發 showMpFinalResult，不用本機這份 endGame UI
    }
    document.getElementById('overlay').style.display='flex';
    const humanWon = mode==='it' ? winner.isHuman : true;
    document.getElementById('endEmoji').textContent = humanWon ? '🏆' : '👻';
    if(mode==='it'){
      document.getElementById('endTitle').textContent = winner.isHuman ? '你是鬼，時限內抓到所有人了！' : winner.name+'(鬼) 獲勝！';
      document.getElementById('endSub').textContent = '所有逃跑者都在時間內被淘汰，鬼贏得了這場追逐！';
    } else {
      const survivors = players.filter((p,i)=> i!==itIndex && p.alive);
      document.getElementById('endTitle').textContent = '時間到！逃跑者獲勝！';
      document.getElementById('endSub').textContent = survivors.map(s=>s.avatar+s.name).join('、')+' 撐過了 60 秒，成功逃過追捕！';
    }

    const settlement = computeSettlement();
    const box = document.createElement('div');
    box.style.textAlign = 'left';
    box.style.fontSize = '13px';
    box.style.margin = '12px 0';
    box.style.lineHeight = '1.9';
    box.innerHTML = '<div style="font-weight:900; color:#7a5b2f; margin-bottom:4px;">💰 金幣結算</div>' +
      settlement.map(r=>{
        const isIt = r.player.id===itIndex;
        const sign = r.delta>=0 ? '+' : '';
        const color = r.delta>=0 ? '#1f7a3d' : '#c8283f';
        return '<div style="display:flex; justify-content:space-between;">'+
          '<span>'+r.player.avatar+' '+r.player.name+(isIt?'(鬼)':'')+'</span>'+
          '<span style="color:'+color+'; font-weight:800;">'+sign+r.delta+'</span>'+
          '</div>';
      }).join('');
    document.getElementById('endSub').after(box);

    spawnConfetti(70);
  }

  function circleOverlap(x1,z1,r1,x2,z2,r2){
    return Math.hypot(x1-x2, z1-z2) < (r1+r2);
  }

  function shrinkZone(){
    zoneRadius = Math.max(MIN_ZONE, zoneRadius - SHRINK_AMOUNT);
    zoneRing.geometry.dispose();
    zoneRing.geometry = new THREE.RingGeometry(zoneRadius-0.15, zoneRadius, 64);
    document.getElementById('stormVignette').classList.remove('show');
    warned = false;
    flash();
    showToast('⚠️ 場地縮小了！範圍：'+zoneRadius.toFixed(0), 'storm');

    // the wall only blocks future movement — anyone already standing outside
    // the new, smaller boundary gets gently pushed back inside by the closing
    // wall instead of being eliminated. only the 鬼 can eliminate a player.
    // push them comfortably inside (not just barely inside) so the movement
    // wall-check below doesn't immediately re-block them from moving at all.
    tokens.forEach(tok=>{
      if(!tok.player.alive) return;
      const dist = Math.hypot(tok.x, tok.z);
      const safeDist = zoneRadius - 1.2;
      if(dist > safeDist){
        const scale = dist>0.001 ? safeDist/dist : 0;
        tok.x *= scale; tok.z *= scale;
        tok.group.position.x = tok.x; tok.group.position.z = tok.z;
      }
    });
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = clock ? Math.min(clock.getDelta(), 0.05) : 0.016;

    // particles
    activeParticles = activeParticles.filter(p=>{
      p.userData.life -= dt;
      if(p.userData.life<=0){ scene.remove(p); return false; }
      p.position.x += p.userData.vx*dt;
      p.position.z += p.userData.vz*dt;
      p.userData.vy -= 9*dt;
      p.position.y += p.userData.vy*dt;
      if(p.position.y<0.1){ p.position.y=0.1; p.userData.vy*=-0.3; }
      return true;
    });

    if(gameRunning && !matchOver){
      updatePlayers(dt);
      resolveOverlaps();

      const elapsed = MP.enabled ? (Date.now()-matchStartAt_local)/1000 : (performance.now()-matchStartAt)/1000;
      updateMatchTimerUI(elapsed);

      // fixed shrink schedule within the 60s match
      if(shrinkStageIndex < SHRINK_AT.length){
        const nextAt = SHRINK_AT[shrinkStageIndex];
        if(!warned && elapsed >= nextAt - WARN_LEAD){
          warned = true;
          document.getElementById('stormVignette').classList.add('show');
          showToast('🚨 場地即將縮小！快回到範圍內！', 'storm');
        }
        if(elapsed >= nextAt){
          shrinkZone();
          shrinkStageIndex++;
        }
      }

      checkZoneDamage(dt);
      sanitizePositions();
      if (!MP.enabled || (players[itIndex] && players[itIndex].isHuman)) checkTag();
      followCamera();

      if (MP.enabled) {
        mpBroadcastTimer += dt;
        if (mpBroadcastTimer > 0.1) {
          mpBroadcastTimer = 0;
          const localTok = tokens.find(t => t.player.isHuman);
          if (localTok) MP.socket.emit('ghosttag_move', { x: localTok.x, z: localTok.z });
        }
      }

      if(elapsed >= MATCH_TIME && !matchOver){
        matchOver = true;
        const survivors = players.filter((p,i)=> i!==itIndex && p.alive);
        if(survivors.length>0){
          endGame(null, 'runners');
        } else {
          endGame(players[itIndex], 'it');
        }
      }
    }

    renderer.render(scene, camera);
  }

  function updateMatchTimerUI(elapsed){
    const remain = Math.max(0, Math.ceil(MATCH_TIME-elapsed));
    const timerEl = document.getElementById('matchTimer');
    timerEl.textContent = '⏱ '+remain;
    timerEl.classList.toggle('urgent', remain<=10);
    document.getElementById('zoneTimer').textContent = zoneRadius<=MIN_ZONE ? '場地已達最小範圍！' : ('目前安全範圍：'+zoneRadius.toFixed(0));
  }

  function updatePlayers(dt){
    tokens.forEach((tok,i)=>{
      if(!tok.player.alive) return;
      if(MP.enabled && !tok.player.isHuman){
        // 遠端玩家：不跑任何AI邏輯，純粹平滑靠向最後收到的網路座標
        if(typeof tok.netX === 'number'){
          tok.x += (tok.netX - tok.x) * Math.min(1, dt*10);
          tok.z += (tok.netZ - tok.z) * Math.min(1, dt*10);
          const dx = tok.netX-tok.x, dz = tok.netZ-tok.z;
          if(Math.hypot(dx,dz) > 0.05){
            const targetAngle = Math.atan2(dx,dz);
            let da = targetAngle - tok.group.rotation.y;
            da = Math.atan2(Math.sin(da), Math.cos(da));
            tok.group.rotation.y += da * Math.min(1, dt*10);
          }
        }
        tok.group.position.x = tok.x;
        tok.group.position.z = tok.z;
        return;
      }
      let mvx=0, mvz=0;
      if(tok.player.isHuman){
        if(keys['arrowup']||keys['w']) mvz -= 1;
        if(keys['arrowdown']||keys['s']) mvz += 1;
        if(keys['arrowleft']||keys['a']) mvx -= 1;
        if(keys['arrowright']||keys['d']) mvx += 1;
        mvx += joyVec.x; mvz += joyVec.y;
      } else {
        const isIt = (i===itIndex);
        if(isIt){
          const target = tokens.filter((t,j)=> j!==itIndex && t.player.alive)
            .sort((a,b)=> Math.hypot(a.x-tok.x,a.z-tok.z) - Math.hypot(b.x-tok.x,b.z-tok.z))[0];
          if(target){ mvx = target.x-tok.x; mvz = target.z-tok.z; }
        } else {
          const itTok = tokens[itIndex];
          const distToIt = Math.hypot(itTok.x-tok.x, itTok.z-tok.z);
          if(distToIt < 9){ mvx = tok.x-itTok.x; mvz = tok.z-itTok.z; }
          else { mvx = -tok.x*0.1; mvz = -tok.z*0.1; } // drift toward center gently
          // steer back inside zone if near edge
          const distCenter = Math.hypot(tok.x, tok.z);
          if(distCenter > zoneRadius-2){ mvx += -tok.x*0.4; mvz += -tok.z*0.4; }
        }
        // obstacle avoidance steering: nudge away from nearby obstacles so AI curves
        // around them instead of walking straight in and getting stuck
        for(const ob of obstacles){
          const ddx = tok.x-ob.x, ddz = tok.z-ob.z;
          const d = Math.hypot(ddx,ddz);
          const avoidRange = ob.r + 2.2;
          if(d < avoidRange && d > 0.001){
            const strength = (avoidRange-d)/avoidRange * 3.2;
            mvx += (ddx/d)*strength;
            mvz += (ddz/d)*strength;
          }
        }
      }
      const len = Math.hypot(mvx,mvz);
      if(len>0.001){
        mvx/=len; mvz/=len;
        const stepX = mvx*tok.speed*dt;
        const stepZ = mvz*tok.speed*dt;

        // axis-separated collision so tokens slide along obstacle edges
        // instead of freezing completely when blocked on one axis.
        // the safe-zone boundary also acts as a solid wall — can't walk past it.
        let nx = tok.x + stepX;
        let blockedX = false;
        for(const ob of obstacles){
          if(circleOverlap(nx,tok.z,0.7, ob.x,ob.z,ob.r)){ blockedX = true; break; }
        }
        if(Math.hypot(nx,tok.z) > zoneRadius-0.6){ blockedX = true; }
        if(!blockedX){ tok.x = Math.max(-boardHalf+1, Math.min(boardHalf-1, nx)); }

        let nz = tok.z + stepZ;
        let blockedZ = false;
        for(const ob of obstacles){
          if(circleOverlap(tok.x,nz,0.7, ob.x,ob.z,ob.r)){ blockedZ = true; break; }
        }
        if(Math.hypot(tok.x,nz) > zoneRadius-0.6){ blockedZ = true; }
        if(!blockedZ){ tok.z = Math.max(-boardHalf+1, Math.min(boardHalf-1, nz)); }

        if(!blockedX || !blockedZ){
          const targetAngle = Math.atan2(mvx,mvz);
          let da = targetAngle - tok.group.rotation.y;
          da = Math.atan2(Math.sin(da), Math.cos(da)); // shortest angle diff
          tok.group.rotation.y += da * Math.min(1, dt*10);
        }
      }
      tok.group.position.x = tok.x;
      tok.group.position.z = tok.z;
    });
  }

  function resolveOverlaps(){
    for(let i=0;i<tokens.length;i++){
      if(!tokens[i].player.alive) continue;
      for(let j=i+1;j<tokens.length;j++){
        if(!tokens[j].player.alive) continue;
        const a = tokens[i], b = tokens[j];
        const dx = b.x-a.x, dz = b.z-a.z;
        const dist = Math.hypot(dx,dz);
        const minDist = 1.5;
        if(dist < 0.0001){
          // exactly overlapping — nudge apart in a fixed direction to avoid a 0/0 division next frame
          a.x -= 0.06; b.x += 0.06;
        } else if(dist < minDist){
          const push = (minDist-dist)/2;
          const nx = dx/dist, nz = dz/dist;
          a.x -= nx*push; a.z -= nz*push;
          b.x += nx*push; b.z += nz*push;
        }
      }
    }
    tokens.forEach(tok=>{
      tok.group.position.x = tok.x;
      tok.group.position.z = tok.z;
    });
  }

  // safety net: if any token's coordinates ever become NaN/Infinity (from an
  // edge-case division), snap it back to the board center instead of letting
  // it silently break the WebGL render loop (which looks like a freeze).
  function sanitizePositions(){
    tokens.forEach(tok=>{
      if(!Number.isFinite(tok.x) || !Number.isFinite(tok.z)){
        tok.x = (Math.random()-0.5)*2;
        tok.z = (Math.random()-0.5)*2;
      }
      tok.group.position.x = tok.x;
      tok.group.position.z = tok.z;
    });
  }

  function checkZoneDamage(dt){
    // the wall blocks normal movement across the boundary. this is just a
    // safety net that clamps anyone nudged outside (e.g. by resolveOverlaps)
    // back inside — the zone itself never eliminates a player, only the 鬼's
    // tag does. clamp comfortably inside the wall's own movement threshold
    // (zoneRadius-0.6) so it doesn't immediately re-trigger a movement block.
    tokens.forEach(tok=>{
      if(!tok.player.alive) return;
      const dist = Math.hypot(tok.x, tok.z);
      const safeDist = zoneRadius - 1.2;
      if(dist > safeDist){
        const scale = dist>0.001 ? safeDist/dist : 0;
        tok.x *= scale; tok.z *= scale;
        tok.group.position.x = tok.x; tok.group.position.z = tok.z;
      }
    });
  }

  function checkTag(){
    const itTok = tokens[itIndex];
    if(!itTok.player.alive) return;
    tokens.forEach((tok,i)=>{
      if(i===itIndex || !tok.player.alive) return;
      if(circleOverlap(itTok.x,itTok.z,0.9, tok.x,tok.z,0.9)){
        eliminatePlayer(tok, 'tag');
        if (MP.enabled) MP.socket.emit('ghosttag_eliminate', { targetToken: tok.player.token });
      }
    });
  }

  function followCamera(){
    const me = tokens[0];
    if(!me) return;
    const targetX = me.x*0.5, targetZ = me.z*0.5 + 24, targetY = 25;
    camera.position.x += (targetX-camera.position.x)*0.05;
    camera.position.y += (targetY-camera.position.y)*0.05;
    camera.position.z += (targetZ-camera.position.z)*0.05;
    if(shakeMagnitude>0){
      camera.position.x += (Math.random()-0.5)*shakeMagnitude;
      camera.position.y += (Math.random()-0.5)*shakeMagnitude*0.6;
      shakeMagnitude *= 0.85;
      if(shakeMagnitude<0.02) shakeMagnitude = 0;
    }
    camera.lookAt(me.x*0.4, 1, me.z*0.4);
  }
})();
</script>
