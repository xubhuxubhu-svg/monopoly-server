<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萌樂終極密碼</title>
<style>
  :root{
    --cream:#fff8ec;
    --pink:#ff8fab;
    --pink-dark:#ef5f86;
    --gold:#ffc857;
    --gold-dark:#e2a72e;
    --ink:#3a2b22;
    --purple-1:#2b1f4d;
    --purple-2:#4a3579;
    --lock:#c9a2ff;
    --shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:"Segoe UI Rounded","PingFang TC","Microsoft JhengHei",sans-serif;
    background: radial-gradient(circle at 50% 0%, #4a3579, #2b1f4d 60%, #1a1233 100%);
    color:var(--ink); overflow-x:hidden;
  }
  h1,h2,h3{margin:0;}
  button{font-family:inherit; cursor:pointer;}

  /* sparkle bg dots */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 70% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 10% 75%, #fff, transparent),
      radial-gradient(2px 2px at 45% 85%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 40%, #fff, transparent);
    opacity:0.5;
  }

  /* ---------- SETUP ---------- */
  #setup{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; text-align:center;
  }
  .logo{
    font-size:38px; font-weight:900; color:var(--gold);
    text-shadow: 3px 3px 0 #6a3fb0, 0 0 18px rgba(255,200,87,0.6);
    letter-spacing:2px; margin-bottom:4px;
  }
  .subtitle{ color:#dcd0ff; font-weight:600; margin-bottom:26px;}
  .card{
    background:var(--cream); border-radius:28px; padding:28px 30px;
    box-shadow: var(--shadow), 0 10px 30px rgba(0,0,0,0.3);
    border:4px solid #fff; max-width:420px; width:100%;
  }
  .section-label{font-weight:800; margin:14px 0 10px; color:#7a5b2f; font-size:15px;}
  .choice-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .choice-btn{
    padding:12px 18px; border-radius:16px; border:3px solid #f0dcb8; background:#fff;
    font-weight:800; font-size:16px; color:#8a6a3a; transition:transform .12s;
  }
  .choice-btn.selected{ background:var(--gold); border-color:var(--gold-dark); color:#5c3e12; transform:scale(1.08);}
  .avatar-btn{
    font-size:30px; padding:8px 10px; border-radius:50%; border:3px solid #f0dcb8; background:#fff;
  }
  .avatar-btn.selected{ background:#ffe08a; border-color:var(--gold-dark); transform:scale(1.15);}
  #startBtn{
    margin-top:22px; padding:14px 40px; border:none; border-radius:20px;
    background:linear-gradient(180deg,var(--pink),var(--pink-dark)); color:#fff; font-weight:900;
    font-size:19px; box-shadow:0 5px 0 #c8446a; letter-spacing:1px;
  }
  #startBtn:active{ transform:translateY(4px); box-shadow:none;}
  .rule-note{font-size:12.5px; color:#8a8a8a; margin-top:16px; line-height:1.6;}

  /* ---------- GAME ---------- */
  #game{ position:relative; z-index:1; display:none; min-height:100vh; padding:14px; }

  .players-row{
    display:flex; justify-content:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;
  }
  .p-badge{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:rgba(255,255,255,0.12); border-radius:16px; padding:8px 12px;
    border:3px solid transparent; transition:all .2s;
  }
  .p-badge.active{ border-color:var(--gold); background:rgba(255,200,87,0.18); transform:scale(1.08); }
  .p-badge .av{
    width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center;
    justify-content:center; font-size:22px; box-shadow:0 3px 6px rgba(0,0,0,0.3);
  }
  .p-badge .nm{ font-size:12px; font-weight:800; color:#fff; }

  .lock-wrap{ text-align:center; margin-bottom:10px; }
  .lock-emoji{ font-size:56px; transition:transform .2s; }
  .lock-emoji.shake{ animation: shake .3s 2; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .range-box{
    max-width:420px; margin:0 auto 16px; background:rgba(255,255,255,0.1); border-radius:18px;
    padding:14px 18px; text-align:center; color:#fff;
  }
  .range-nums{ font-size:22px; font-weight:900; color:var(--gold); margin-bottom:8px;}
  .range-bar-wrap{ height:14px; background:rgba(255,255,255,0.15); border-radius:8px; overflow:hidden; position:relative;}
  .range-bar{ position:absolute; top:0; bottom:0; background:linear-gradient(90deg,var(--pink),var(--gold)); border-radius:8px; transition: all .3s;}

  .status-line{ text-align:center; color:#fff; font-weight:800; font-size:16px; min-height:24px; margin-bottom:10px;}

  .feedback-bubble{
    max-width:280px; margin:0 auto 14px; text-align:center; font-size:20px; font-weight:900;
    padding:10px; border-radius:16px; opacity:0; transition:all .25s; transform:scale(0.8);
  }
  .feedback-bubble.show{ opacity:1; transform:scale(1); }
  .feedback-bubble.high{ background:#ffdada; color:#c8283f; }
  .feedback-bubble.low{ background:#dbeaff; color:#1f5fae; }
  .feedback-bubble.bingo{ background:#fff2c2; color:#a5700a; }

  .history-log{
    max-width:420px; margin:0 auto 16px; max-height:130px; overflow-y:auto;
    background:rgba(0,0,0,0.2); border-radius:14px; padding:8px 12px;
  }
  .history-item{ font-size:12.5px; color:#f0e9ff; padding:3px 0; display:flex; justify-content:space-between; gap:6px;}
  .history-item .h-tag{ font-weight:800; }
  .history-item .h-hint-high{ color:#ff9d9d; }
  .history-item .h-hint-low{ color:#9dc4ff; }
  .history-item .h-hint-bingo{ color:#ffd76b; }

  .keypad-wrap{
    max-width:280px; margin:0 auto; display:none;
  }
  .keypad-display{
    background:var(--cream); border-radius:14px; text-align:center; font-size:28px; font-weight:900;
    padding:10px; margin-bottom:10px; min-height:46px; color:var(--ink); letter-spacing:2px;
  }
  .keypad-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  }
  .keypad-grid button{
    padding:16px 0; border-radius:14px; border:none; background:#fff; font-size:20px; font-weight:800;
    color:#5c3e12; box-shadow:0 4px 0 #d8c69a;
  }
  .keypad-grid button:active{ transform:translateY(3px); box-shadow:none;}
  .keypad-grid .wide{ grid-column:span 1; }
  #submitGuess{
    margin-top:10px; width:100%; padding:14px; border:none; border-radius:16px;
    background:linear-gradient(180deg,var(--pink),var(--pink-dark)); color:#fff; font-weight:900;
    font-size:18px; box-shadow:0 5px 0 #c8446a;
  }
  #submitGuess:active{ transform:translateY(4px); box-shadow:none;}
  .kp-warn{ text-align:center; color:#ffb3b3; font-size:12.5px; min-height:16px; margin-top:6px; font-weight:800;}

  /* ---------- 手機小螢幕壓縮：避免內容擠出畫面看不到送出按鈕 ---------- */
  @media (max-height: 780px), (max-width: 400px){
    #game{ padding:8px; }
    .players-row{ margin-bottom:8px; gap:8px; }
    .p-badge{ padding:5px 8px; }
    .p-badge .av{ width:30px; height:30px; font-size:16px; }
    .p-badge .nm{ font-size:10px; }
    .lock-wrap{ margin-bottom:2px; }
    .lock-emoji{ font-size:34px; }
    .range-box{ padding:8px 14px; margin-bottom:8px; }
    .range-nums{ font-size:16px; margin-bottom:4px; }
    .range-bar-wrap{ height:10px; }
    .status-line{ font-size:13px; min-height:18px; margin-bottom:4px; }
    .feedback-bubble{ padding:6px; font-size:15px; margin-bottom:6px; }
    .history-log{ max-height:70px; padding:5px 10px; margin-bottom:8px; }
    .history-item{ font-size:11px; padding:1px 0; }
    .keypad-wrap{ max-width:240px; }
    .keypad-display{ font-size:20px; padding:6px; margin-bottom:6px; min-height:34px; }
    .keypad-grid{ gap:5px; }
    .keypad-grid button{ padding:9px 0; font-size:16px; }
    #submitGuess{ margin-top:6px; padding:10px; font-size:15px; }
  }
  @media (max-height: 620px){
    .lock-wrap{ display:none; }
    .history-log{ max-height:46px; }
  }

  .keypad-display.boom-flash{
    color:#fff; background:linear-gradient(135deg,#ff5b3c,#ffb703);
    transform:scale(1.2) rotate(-2deg); box-shadow:0 0 0 6px rgba(255,91,60,0.35);
  }
  .keypad-wrap.shake-strong{ animation: shakeStrong .45s; }
  @keyframes shakeStrong{
    0%,100%{ transform:translateX(0) rotate(0); }
    15%{ transform:translateX(-14px) rotate(-3deg); }
    30%{ transform:translateX(12px) rotate(3deg); }
    45%{ transform:translateX(-10px) rotate(-2deg); }
    60%{ transform:translateX(10px) rotate(2deg); }
    75%{ transform:translateX(-6px) rotate(-1deg); }
    90%{ transform:translateX(6px) rotate(1deg); }
  }
  .boom-particle{
    position:fixed; z-index:999; font-size:26px; pointer-events:none; left:0; top:0;
    animation: boomFly .65s ease-out forwards;
    will-change:transform, opacity;
  }
  @keyframes boomFly{
    0%{ transform:translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1;}
    55%{ opacity:1;}
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.6) rotate(var(--rot)); opacity:0;}
  }
  .boom-ring{
    position:fixed; z-index:998; width:20px; height:20px; border-radius:50%; left:0; top:0;
    border:5px solid #ffb703; pointer-events:none;
    animation: boomRing .5s ease-out forwards;
  }
  @keyframes boomRing{
    0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0.9; }
    100%{ transform:translate(-50%,-50%) scale(6); opacity:0; }
  }

  /* ---------- END OVERLAY ---------- */
  #overlay{
    display:none; position:fixed; inset:0; background:rgba(10,5,25,0.72); z-index:50;
    align-items:center; justify-content:center;
  }
  .end-card{
    background:var(--cream); border-radius:28px; padding:34px 40px; text-align:center;
    border:5px solid #fff; box-shadow:0 12px 0 rgba(0,0,0,0.2); max-width:360px;
  }
  .end-emoji{ font-size:58px; }
  .end-title{ font-size:26px; font-weight:900; color:var(--pink-dark); margin:8px 0;}
  .end-sub{ font-size:14px; color:#7a5b2f; margin-bottom:10px; line-height:1.6;}
  .end-answer{ font-size:15px; font-weight:800; color:#6a3fb0; margin-bottom:20px;}
  #restartBtn{
    padding:12px 34px; border:none; border-radius:18px;
    background:linear-gradient(180deg,var(--pink),var(--pink-dark)); color:#fff; font-weight:900;
    font-size:16px; box-shadow:0 5px 0 #c8446a;
  }
  #restartBtn:active{ transform:translateY(4px); box-shadow:none;}

  /* ---------- 連線多人大廳 ---------- */
  #modeSelectRow{ display:flex; gap:10px; justify-content:center; margin-bottom:18px; }
  .mode-btn{
    flex:1; padding:12px 10px; border-radius:16px; border:3px solid #f0dcb8; background:#fff;
    font-weight:800; font-size:14px; color:#8a6a3a;
  }
  .mode-btn.selected{ background:var(--gold); border-color:var(--gold-dark); color:#5c3e12; }
  #mpLobbyBox{ display:none; }
  #mpLobbyBox input[type="text"]{
    width:100%; box-sizing:border-box; padding:10px 12px; border-radius:12px; border:2px solid #f0dcb8;
    font-size:14px; margin-top:6px; margin-bottom:10px;
  }
  .mp-btn{
    flex:1; border:none; border-radius:14px; padding:11px; font-weight:800; font-size:14px;
    color:#fff; background:#8a6bcf; cursor:pointer;
  }
  .mp-btn.primary{ background:linear-gradient(180deg,var(--pink),var(--pink-dark)); }
  .mp-btn:disabled{ opacity:0.4; }
  #mpConnStatusPw{ font-size:12px; color:#9a8a6a; margin-top:8px; min-height:16px; }
  #mpRoomBoxPw{ display:none; }
  .mp-room-code-pw{ font-size:24px; font-weight:900; text-align:center; letter-spacing:3px; color:var(--pink-dark); margin:8px 0; }
  .mp-player-row-pw{
    display:flex; justify-content:space-between; background:#fbf3e0; border-radius:10px;
    padding:8px 12px; font-size:13px; margin-bottom:6px; font-weight:700; color:#7a5b2f;
  }
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<div id="setup">
  <div class="logo">🔒 終極密碼</div>
  <div class="subtitle">Q版猜數字・先猜中就獲勝！</div>

  <div id="modeSelectRow">
    <button class="mode-btn selected" id="modeSoloBtn">🤖 單機挑戰AI</button>
    <button class="mode-btn" id="modeMpBtn">🌐 連線多人</button>
  </div>

  <div class="card" id="soloCard">
    <div class="section-label">🎯 選擇參賽人數(含你)</div>
    <div class="choice-row" id="playerCountRow">
      <button class="choice-btn" data-n="2">2 人</button>
      <button class="choice-btn selected" data-n="4">4 人</button>
      <button class="choice-btn" data-n="3">3 人</button>
    </div>
    <div class="section-label">🔢 選擇密碼範圍</div>
    <div class="choice-row" id="rangeRow">
      <button class="choice-btn" data-r="50">1～50</button>
      <button class="choice-btn selected" data-r="100">1～100</button>
      <button class="choice-btn" data-r="200">1～200</button>
    </div>
    <div class="section-label">🐾 選擇你的頭像</div>
    <div class="choice-row" id="avatarRow"></div>
    <button id="startBtn">開始解密！</button>
    <div class="rule-note">規則：系統會偷偷選一個神秘數字，大家輪流猜；<br>猜太大會縮小上限、猜太小會提高下限，<br>範圍會越來越小，第一個猜中的人獲勝！</div>
  </div>

  <div class="card" id="mpLobbyBox">
    <div id="mpConnectSectionPw">
      <div class="section-label">伺服器網址</div>
      <input type="text" id="mpServerUrlPw" placeholder="https://your-server.onrender.com" value="https://monopoly-server-1-fwtn.onrender.com">
      <div class="section-label">你的暱稱</div>
      <input type="text" id="mpNameInputPw" placeholder="輸入暱稱" value="玩家">
      <div class="section-label">🐾 選擇你的頭像</div>
      <div class="choice-row" id="avatarRowMp"></div>
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button class="mp-btn primary" id="mpCreateBtnPw">🏠 建立新房間</button>
        <button class="mp-btn" id="mpJoinBtnPw">🚪 加入房間</button>
      </div>
      <input type="text" id="mpJoinCodeInputPw" placeholder="輸入4位房間代碼" style="display:none; text-transform:uppercase;">
      <div id="mpConnStatusPw"></div>
    </div>

    <div id="mpRoomBoxPw">
      <div class="section-label">房間代碼</div>
      <div class="mp-room-code-pw" id="mpRoomCodeDisplayPw"></div>
      <div id="mpPlayerListBoxPw"></div>
      <div class="section-label" id="mpRangeLabelPw" style="display:none; margin-top:14px;">🔢 選擇密碼範圍（房主設定）</div>
      <div class="choice-row" id="mpRangeRowPw" style="display:none;">
        <button class="choice-btn" data-r="50">1～50</button>
        <button class="choice-btn selected" data-r="100">1～100</button>
        <button class="choice-btn" data-r="200">1～200</button>
      </div>
      <button class="mp-btn primary" id="mpStartBtnPw" style="width:100%; margin-top:14px; display:none;" disabled>開始連線對戰（至少2人）</button>
      <div class="rule-note" id="mpWaitingNotePw" style="display:none;">等待房主開始遊戲…</div>
    </div>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game">
  <div class="players-row" id="playersRow"></div>

  <div class="lock-wrap">
    <div class="lock-emoji" id="lockEmoji">🔒</div>
  </div>

  <div class="range-box">
    <div class="range-nums" id="rangeNums">範圍：1 ～ 100</div>
    <div class="range-bar-wrap"><div class="range-bar" id="rangeBar"></div></div>
  </div>

  <div class="status-line" id="statusLine">遊戲準備中...</div>
  <div class="feedback-bubble" id="feedbackBubble"></div>

  <div class="history-log" id="historyLog"></div>

  <div class="keypad-wrap" id="keypadWrap">
    <div class="keypad-display" id="keypadDisplay">&nbsp;</div>
    <div class="keypad-grid">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="clear">C</button><button data-k="0">0</button><button data-k="back">⌫</button>
    </div>
    <button id="submitGuess">送出猜測</button>
    <div class="kp-warn" id="kpWarn"></div>
  </div>
</div>

<!-- ============ END OVERLAY ============ -->
<div id="overlay">
  <div class="end-card">
    <div class="end-emoji" id="endEmoji">🎉</div>
    <div class="end-title" id="endTitle">獲勝！</div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-answer" id="endAnswer"></div>
    <button id="restartBtn">再玩一次</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function(){
  const AVATARS = ["🐱","🐶","🐰","🐼","🦊","🐻"];
  const NAMES = ['你','阿福','小綠','阿旺'];
  let chosenAvatar = 0;
  let playerCount = 4;
  let rangeMax = 100;

  // ---------- setup wiring ----------
  const avatarRow = document.getElementById('avatarRow');
  AVATARS.forEach((a,i)=>{
    const b = document.createElement('button');
    b.className = 'avatar-btn'+(i===0?' selected':'');
    b.textContent = a;
    b.onclick = ()=>{
      [...avatarRow.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
      chosenAvatar = i;
    };
    avatarRow.appendChild(b);
  });
  document.getElementById('playerCountRow').addEventListener('click',e=>{
    const btn = e.target.closest('.choice-btn');
    if(!btn) return;
    [...document.getElementById('playerCountRow').children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected');
    playerCount = parseInt(btn.dataset.n,10);
  });
  document.getElementById('rangeRow').addEventListener('click',e=>{
    const btn = e.target.closest('.choice-btn');
    if(!btn) return;
    [...document.getElementById('rangeRow').children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected');
    rangeMax = parseInt(btn.dataset.r,10);
  });
  document.getElementById('startBtn').onclick = ()=>{
    document.getElementById('setup').style.display='none';
    document.getElementById('game').style.display='block';
    initGame();
  };
  document.getElementById('restartBtn').onclick = ()=>{
    document.getElementById('overlay').style.display='none';
    document.getElementById('setup').style.display='flex';
  };

  // ---------- 單機/連線模式切換 ----------
  const soloCardEl = document.getElementById('soloCard');
  const mpLobbyBoxEl = document.getElementById('mpLobbyBox');
  const modeSoloBtn = document.getElementById('modeSoloBtn');
  const modeMpBtn = document.getElementById('modeMpBtn');
  modeSoloBtn.addEventListener('click', ()=>{
    modeSoloBtn.classList.add('selected'); modeMpBtn.classList.remove('selected');
    soloCardEl.style.display='block'; mpLobbyBoxEl.style.display='none';
  });
  modeMpBtn.addEventListener('click', ()=>{
    modeMpBtn.classList.add('selected'); modeSoloBtn.classList.remove('selected');
    soloCardEl.style.display='none'; mpLobbyBoxEl.style.display='block';
  });

  // ================= 連線多人模式 =================
  const MPW = { socket:null, myId:null, myName:'', roomCode:null, isHost:false, rangeMax:100 };
  let chosenAvatarMp = 0;
  const avatarRowMp = document.getElementById('avatarRowMp');
  AVATARS.forEach((a,i)=>{
    const b = document.createElement('button');
    b.className = 'avatar-btn'+(i===0?' selected':'');
    b.textContent = a;
    b.onclick = ()=>{
      [...avatarRowMp.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
      chosenAvatarMp = i;
    };
    avatarRowMp.appendChild(b);
  });

  const mpConnectSectionPwEl = document.getElementById('mpConnectSectionPw');
  const mpRoomBoxPwEl = document.getElementById('mpRoomBoxPw');
  const mpServerUrlPwEl = document.getElementById('mpServerUrlPw');
  const mpNameInputPwEl = document.getElementById('mpNameInputPw');
  const mpCreateBtnPwEl = document.getElementById('mpCreateBtnPw');
  const mpJoinBtnPwEl = document.getElementById('mpJoinBtnPw');
  const mpJoinCodeInputPwEl = document.getElementById('mpJoinCodeInputPw');
  const mpConnStatusPwEl = document.getElementById('mpConnStatusPw');
  const mpRoomCodeDisplayPwEl = document.getElementById('mpRoomCodeDisplayPw');
  const mpPlayerListBoxPwEl = document.getElementById('mpPlayerListBoxPw');
  const mpRangeLabelPwEl = document.getElementById('mpRangeLabelPw');
  const mpRangeRowPwEl = document.getElementById('mpRangeRowPw');
  const mpStartBtnPwEl = document.getElementById('mpStartBtnPw');
  const mpWaitingNotePwEl = document.getElementById('mpWaitingNotePw');

  function mpSetStatusPw(msg){ mpConnStatusPwEl.textContent = msg; }

  function mpConnectSocketPw(){
    if(MPW.socket) return;
    let url = (mpServerUrlPwEl.value||'').trim();
    if(url.endsWith('/')) url = url.slice(0,-1);
    mpSetStatusPw('連線中…');
    MPW.socket = io(url, { transports:['websocket','polling'] });
    MPW.socket.on('connect', ()=>{ MPW.myId = MPW.socket.id; mpSetStatusPw('已連線到伺服器 ✓'); });
    MPW.socket.on('connect_error', (err)=>{ mpSetStatusPw('連線失敗：'+(err.message||'請確認伺服器網址')); });
    MPW.socket.on('room_state', (state_)=>{ mpRenderPlayerListPw(state_); });
    MPW.socket.on('password_game_start', (payload)=>{ mpOnPasswordGameStart(payload); });
    MPW.socket.on('password_guess_result', (data)=>{ mpOnGuessResult(data); });
    MPW.socket.on('pw_player_left', ()=>{ setStatus('⚠️ 有一位玩家斷線了'); });
  }

  mpCreateBtnPwEl.addEventListener('click', ()=>{
    mpConnectSocketPw();
    MPW.myName = (mpNameInputPwEl.value||'玩家').slice(0,12);
    const tryEmit = ()=>{
      if(!MPW.socket.connected){ setTimeout(tryEmit,300); return; }
      MPW.socket.emit('create_room', { playerName: MPW.myName }, (res)=>{
        if(!res.ok){ mpSetStatusPw('建立失敗：'+res.error); return; }
        MPW.roomCode = res.roomCode; MPW.isHost = true;
        mpEnterRoomViewPw(res.state);
      });
    };
    tryEmit();
  });
  mpJoinBtnPwEl.addEventListener('click', ()=>{
    if(mpJoinCodeInputPwEl.style.display==='none'){ mpJoinCodeInputPwEl.style.display='block'; mpJoinCodeInputPwEl.focus(); return; }
    mpConnectSocketPw();
    MPW.myName = (mpNameInputPwEl.value||'玩家').slice(0,12);
    const code = mpJoinCodeInputPwEl.value.toUpperCase().trim();
    if(!code){ mpSetStatusPw('請輸入房間代碼'); return; }
    const tryEmit = ()=>{
      if(!MPW.socket.connected){ setTimeout(tryEmit,300); return; }
      MPW.socket.emit('join_room', { roomCode:code, playerName:MPW.myName }, (res)=>{
        if(!res.ok){ mpSetStatusPw('加入失敗：'+res.error); return; }
        MPW.roomCode = res.roomCode; MPW.isHost = false;
        mpEnterRoomViewPw(res.state);
      });
    };
    tryEmit();
  });

  function mpEnterRoomViewPw(state_){
    mpConnectSectionPwEl.style.display='none';
    mpRoomBoxPwEl.style.display='block';
    mpRoomCodeDisplayPwEl.textContent = MPW.roomCode;
    mpRenderPlayerListPw(state_);
  }
  function mpRenderPlayerListPw(state_){
    if(!MPW.roomCode) return;
    mpPlayerListBoxPwEl.innerHTML='';
    (state_.players||[]).forEach(p=>{
      const row = document.createElement('div');
      row.className = 'mp-player-row-pw';
      row.innerHTML = '<span>'+(p.isHost?'👑 ':'')+p.name+(p.id===MPW.myId?'（你）':'')+'</span>';
      mpPlayerListBoxPwEl.appendChild(row);
    });
    const me = (state_.players||[]).find(p=>p.id===MPW.myId);
    MPW.isHost = !!(me && me.isHost);
    const enough = (state_.players||[]).length >= 2;
    if(MPW.isHost){
      mpRangeLabelPwEl.style.display='block'; mpRangeRowPwEl.style.display='flex';
      mpStartBtnPwEl.style.display='block'; mpWaitingNotePwEl.style.display='none';
      mpStartBtnPwEl.disabled = !enough;
      mpStartBtnPwEl.textContent = enough ? '🚀 開始連線對戰' : '開始連線對戰（至少2人）';
    } else {
      mpRangeLabelPwEl.style.display='none'; mpRangeRowPwEl.style.display='none';
      mpStartBtnPwEl.style.display='none'; mpWaitingNotePwEl.style.display='block';
    }
  }
  mpRangeRowPwEl.addEventListener('click', e=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    [...mpRangeRowPwEl.children].forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected');
    MPW.rangeMax = parseInt(btn.dataset.r,10);
  });
  mpStartBtnPwEl.addEventListener('click', ()=>{
    MPW.socket.emit('password_start_game', { rangeMax: MPW.rangeMax }, (res)=>{
      if(!res.ok) mpSetStatusPw('開始失敗：'+res.error);
    });
  });

  function mpOnPasswordGameStart(payload){
    document.getElementById('setup').style.display='none';
    document.getElementById('game').style.display='block';
    const remotePool = AVATARS.slice();
    const players = payload.seatOrder.map((seat,i)=>{
      const isLocal = seat.id===MPW.myId;
      return {
        id:i, socketId:seat.id, name:seat.name, isHuman:true, isLocal,
        avatar: isLocal ? AVATARS[chosenAvatarMp] : remotePool[i % remotePool.length]
      };
    });
    state = {
      isMp:true, players, target:null, low:1, high:payload.rangeMax, originalRange:payload.rangeMax,
      currentIndex: payload.startSeatIdx, history:[], kpValue:'', awaitingHuman:false, resolveGuess:null
    };
    renderPlayersRow();
    renderRange();
    document.getElementById('historyLog').innerHTML='';
    document.getElementById('feedbackBubble').className='feedback-bubble';
    document.getElementById('lockEmoji').textContent='🔒';
    wireKeypad();
    setStatus('遊戲開始！密碼已經藏好了，準備猜猜看...');
    updateTurnUiMP();
  }

  function updateTurnUiMP(){
    const p = state.players[state.currentIndex];
    updateActiveBadge();
    if(p.isLocal){
      setStatus('輪到你了，範圍 '+state.low+' ～ '+state.high+'，請輸入猜測');
      document.getElementById('keypadWrap').style.display='block';
      document.getElementById('kpWarn').textContent='';
      state.kpValue=''; updateKeypadDisplay();
      state.awaitingHuman = true;
      state.resolveGuess = (val)=>{
        MPW.socket.emit('password_submit_guess', { guess: val }, (res)=>{
          if(!res || !res.ok){
            document.getElementById('kpWarn').textContent = (res&&res.error)||'送出失敗，請再試一次';
            state.awaitingHuman = true;
            document.getElementById('keypadWrap').style.display='block';
          }
        });
      };
    } else {
      document.getElementById('keypadWrap').style.display='none';
      setStatus(p.name+' 思考中...');
    }
  }

  function mpOnGuessResult(data){
    const guesser = state.players.find(pl=>pl.socketId===data.guesserSeatId);
    const name = guesser ? guesser.name : data.guesserName;
    state.low = data.low; state.high = data.high;
    pushHistory(name, data.guess, data.hint);
    showFeedback(data.hint);
    renderRange();
    if(data.bingo){
      state.target = data.target;
      setTimeout(()=>{ endGame(guesser || {isLocal:false,isHuman:false,name}); }, 900);
      return;
    }
    state.currentIndex = data.nextSeatIdx;
    setTimeout(updateTurnUiMP, 500);
  }

  // ---------- state ----------
  let state = null;

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function delay(ms){ return new Promise(res=>setTimeout(res,ms)); }

  function initGame(){
    const avatars = [AVATARS[chosenAvatar]];
    const pool = AVATARS.filter((_,i)=>i!==chosenAvatar);
    for(let i=1;i<playerCount;i++) avatars.push(pool[(i-1)%pool.length]);

    const players = [];
    for(let i=0;i<playerCount;i++){
      players.push({
        id:i, name: i===0?'你':NAMES[i], avatar: avatars[i], isHuman: i===0,
        smartness: rand(0.4,0.85)
      });
    }
    const target = Math.floor(rand(1, rangeMax+1));
    state = {
      players, target, low:1, high:rangeMax, originalRange:rangeMax,
      currentIndex:0, history:[], kpValue:'', awaitingHuman:false, resolveGuess:null
    };
    renderPlayersRow();
    renderRange();
    document.getElementById('historyLog').innerHTML='';
    document.getElementById('feedbackBubble').className='feedback-bubble';
    document.getElementById('lockEmoji').textContent='🔒';
    wireKeypad();
    setStatus('遊戲開始！密碼已經藏好了，準備猜猜看...');
    setTimeout(runTurnLoop, 700);
  }

  function renderPlayersRow(){
    const row = document.getElementById('playersRow');
    row.innerHTML = '';
    state.players.forEach(p=>{
      const div = document.createElement('div');
      div.className = 'p-badge';
      div.id = 'pb-'+p.id;
      div.innerHTML = `<div class="av">${p.avatar}</div><div class="nm">${p.name}</div>`;
      row.appendChild(div);
    });
  }

  function updateActiveBadge(){
    state.players.forEach(p=>{
      document.getElementById('pb-'+p.id).classList.toggle('active', p.id===state.currentIndex);
    });
  }

  function renderRange(){
    document.getElementById('rangeNums').textContent = '範圍：'+state.low+' ～ '+state.high;
    const bar = document.getElementById('rangeBar');
    const total = state.originalRange;
    const leftPct = ((state.low-1)/total)*100;
    const widthPct = ((state.high-state.low+1)/total)*100;
    bar.style.left = leftPct+'%';
    bar.style.width = Math.max(widthPct,1.5)+'%';
  }

  function setStatus(msg){ document.getElementById('statusLine').textContent = msg; }

  function pushHistory(name, guess, hint){
    state.history.push({name,guess,hint});
    const log = document.getElementById('historyLog');
    const div = document.createElement('div');
    div.className = 'history-item';
    const hintText = hint==='high' ? '太大了 ⬇️' : (hint==='low' ? '太小了 ⬆️' : '賓果！🎉');
    const hintClass = hint==='high' ? 'h-hint-high' : (hint==='low' ? 'h-hint-low' : 'h-hint-bingo');
    div.innerHTML = `<span class="h-tag">${name} 猜 ${guess}</span><span class="${hintClass}">${hintText}</span>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function showFeedback(hint){
    const bubble = document.getElementById('feedbackBubble');
    const lock = document.getElementById('lockEmoji');
    bubble.className = 'feedback-bubble show '+hint;
    if(hint==='high'){ bubble.textContent = '太大了！⬇️'; lock.classList.add('shake'); }
    else if(hint==='low'){ bubble.textContent = '太小了！⬆️'; lock.classList.add('shake'); }
    else { bubble.textContent = '賓果！猜中了！🎉'; lock.textContent='🔓'; }
    setTimeout(()=>{ lock.classList.remove('shake'); }, 400);
    setTimeout(()=>{ bubble.classList.remove('show'); }, 1200);
  }

  function aiGuess(p){
    const mid = Math.round((state.low+state.high)/2);
    if(Math.random() < p.smartness){
      return mid;
    }
    return Math.floor(rand(state.low, state.high+1));
  }

  // ---------- keypad ----------
  function wireKeypad(){
    const grid = document.querySelector('.keypad-grid');
    grid.onclick = (e)=>{
      const btn = e.target.closest('button');
      if(!btn || !state.awaitingHuman) return;
      const k = btn.dataset.k;
      if(k==='clear'){ state.kpValue=''; document.getElementById('kpWarn').textContent=''; }
      else if(k==='back'){ state.kpValue = state.kpValue.slice(0,-1); }
      else {
        if(state.kpValue.length < String(state.originalRange).length){
          state.kpValue += k;
          if(checkAndExplodeIfDoomed()) return; // already cleared + fx fired
        }
      }
      updateKeypadDisplay();
    };
    document.getElementById('submitGuess').onclick = ()=>{
      if(!state.awaitingHuman) return;
      const val = parseInt(state.kpValue,10);
      const warn = document.getElementById('kpWarn');
      if(isNaN(val) || val < state.low || val > state.high){
        warn.textContent = '請輸入 '+state.low+' 到 '+state.high+' 之間的數字喔';
        return;
      }
      warn.textContent = '';
      state.awaitingHuman = false;
      document.getElementById('keypadWrap').style.display = 'none';
      const r = state.resolveGuess;
      state.resolveGuess = null;
      state.kpValue = '';
      r(val);
    };
  }
  function updateKeypadDisplay(){
    document.getElementById('keypadDisplay').textContent = state.kpValue || ' ';
  }

  // real-time check: is the current prefix already unable to land in [low,high]
  // no matter what digits get typed next (or if stopped right now)? if so, boom+clear.
  function checkAndExplodeIfDoomed(){
    const prefix = state.kpValue;
    if(!prefix) return false;
    const prefixVal = parseInt(prefix,10);
    const maxLen = String(state.high).length;
    const remaining = Math.max(0, maxLen - prefix.length);
    const maxAchievable = prefixVal * Math.pow(10, remaining) + (Math.pow(10, remaining) - 1);
    const doomed = (prefixVal > state.high) || (maxAchievable < state.low);
    if(doomed){
      state.kpValue = '';
      triggerExplosion();
      return true;
    }
    return false;
  }

  function spawnExplosionAt(x, y){
    const emojis = ['💥','✨','⭐','🔥','💫','🌟'];
    const ring = document.createElement('div');
    ring.className = 'boom-ring';
    ring.style.left = x+'px';
    ring.style.top = y+'px';
    document.body.appendChild(ring);
    setTimeout(()=> ring.remove(), 520);

    for(let i=0;i<16;i++){
      const el = document.createElement('div');
      el.className = 'boom-particle';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 55 + Math.random()*100;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      el.style.left = x+'px';
      el.style.top = y+'px';
      el.style.fontSize = (18+Math.random()*16)+'px';
      el.style.setProperty('--dx', dx.toFixed(1)+'px');
      el.style.setProperty('--dy', dy.toFixed(1)+'px');
      el.style.setProperty('--rot', (Math.random()*360-180).toFixed(0)+'deg');
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), 700);
    }
  }

  function triggerExplosion(){
    const disp = document.getElementById('keypadDisplay');
    const wrap = document.getElementById('keypadWrap');
    const rect = disp.getBoundingClientRect();
    spawnExplosionAt(rect.left + rect.width/2, rect.top + rect.height/2);

    disp.textContent = '💥';
    disp.classList.add('boom-flash');
    wrap.classList.add('shake-strong');
    const warn = document.getElementById('kpWarn');
    warn.textContent = '超出範圍啦！自動清空重新輸入～';

    setTimeout(()=>{
      disp.classList.remove('boom-flash');
      wrap.classList.remove('shake-strong');
      updateKeypadDisplay();
    }, 480);
  }

  function endGame(winner){
    const iWon = state.isMp ? !!winner.isLocal : !!winner.isHuman;
    document.getElementById('overlay').style.display='flex';
    document.getElementById('endEmoji').textContent = iWon ? '🎉' : '🔐';
    document.getElementById('endTitle').textContent = iWon ? '你贏了！' : winner.name+' 獲勝！';
    document.getElementById('endSub').textContent = iWon
      ? '恭喜猜中神秘密碼，你是本局的解密高手！'
      : winner.name+' 搶先猜中了密碼，下次再挑戰看看！';
    document.getElementById('endAnswer').textContent = '正確答案是：'+state.target;
  }

  async function runTurnLoop(){
    while(true){
      const p = state.players[state.currentIndex];
      updateActiveBadge();
      let guess;
      if(p.isHuman){
        setStatus('輪到你了，範圍 '+state.low+' ～ '+state.high+'，請輸入猜測');
        document.getElementById('keypadWrap').style.display = 'block';
        document.getElementById('kpWarn').textContent='';
        state.kpValue=''; updateKeypadDisplay();
        state.awaitingHuman = true;
        guess = await new Promise(res=>{ state.resolveGuess = res; });
      } else {
        setStatus(p.name+' 思考中...');
        await delay(rand(600,1100));
        guess = aiGuess(p);
      }

      if(guess === state.target){
        pushHistory(p.name, guess, 'bingo');
        showFeedback('bingo');
        renderRange();
        await delay(900);
        endGame(p);
        return;
      } else if(guess < state.target){
        state.low = guess+1;
        pushHistory(p.name, guess, 'low');
        showFeedback('low');
      } else {
        state.high = guess-1;
        pushHistory(p.name, guess, 'high');
        showFeedback('high');
      }
      renderRange();
      state.currentIndex = (state.currentIndex+1) % state.players.length;
      await delay(500);
    }
  }
})();
</script>
</body>
</html>
